<body class="bg-brand-50 text-brand-900 antialiased min-h-screen pb-28 selection:bg-brand-200">

  <!-- 頂部導航 -->

    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div>

          <i class="fa-solid fa-file-signature text-[#8C7355]"></i>
          <span>線上定型化契約存證</span>
        </h1>
        <p class="text-[10px] text-brand-400 font-mono" id="disp-industry-tag">電子簽章法律存證系統</p>
      </div>
      <button type="button" onclick="openStaffManagerPrompt()" class="px-3 py-1.5 bg-brand-100 hover:bg-brand-200 text-brand-800 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs">
        <i class="fa-solid fa-folder-closed text-[#8C7355]"></i>

    </div>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- 1. 立約人資料填寫卡片 (自動智慧切換 行業別) -->
    <section class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3.5">
      <div class="flex justify-between items-center pb-2 border-b border-brand-100">
        <span class="text-xs font-bold text-brand-900 flex items-center gap-1.5">
          <i class="fa-solid fa-user-pen text-[#8C7355]"></i> 立約人資訊登記
        </span>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-800 font-bold" id="badge-industry-mode">美業沙龍模式</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
        <div>
          <label class="block font-bold text-brand-800 text-[10.5px] mb-1">立約顧客姓名 *：</label>
          <input type="text" id="signer-name" placeholder="例: 王小美" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 outline-none font-bold">
        </div>
        <div>
          <label class="block font-bold text-brand-800 text-[10.5px] mb-1">聯絡手機號碼 *：</label>
          <input type="tel" id="signer-phone" maxlength="10" placeholder="0912345678" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-mono font-bold outline-none">
        </div>
        <div class="col-span-full">
          <label class="block font-bold text-brand-800 text-[10.5px] mb-1">電子信箱 * (Resend 將自動寄發契約副本)：</label>
          <input type="email" id="signer-email" placeholder="client@gmail.com" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-mono outline-none">
        </div>

        <!-- 寵美模式專屬欄位 (動態顯示) -->
        <div id="box-pet-fields" class="col-span-full p-3 bg-amber-50/70 rounded-2xl border border-amber-200 space-y-2 hidden">
          <div class="font-bold text-amber-950 flex items-center gap-1.5 text-xs">
            <i class="fa-solid fa-paw text-amber-600"></i> 毛孩身分標記 (寵美專用)
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-amber-900 mb-1">毛孩名字 *：</label>
              <input type="text" id="pet-name" placeholder="例: 波比" class="w-full p-2 bg-white rounded-xl border border-amber-300 text-xs font-bold outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-amber-900 mb-1">品種/犬種：</label>

            </div>

              <input type="text" id="pet-condition" placeholder="例: 心臟敏感/護手" class="w-full p-2 bg-white rounded-xl border border-amber-300 text-xs outline-none">

        <!-- 施作項目下拉選單 -->

    </section>

    <!-- 2. 定型化契約正式條款 (智慧滾動檢測) -->
    <section class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">

        </span>

        <!-- 內容由 JS 動態填入 -->

      <!-- 同意條款勾選框 (未滑到底部前為 disabled 鎖定) -->

        <label id="agree-label" class="flex items-center gap-2 text-xs font-bold text-gray-400 cursor-not-allowed select-none transition">
          <input type="checkbox" id="cb-agree-contract" disabled onchange="toggleSignatureArea(this.checked)" class="w-4 h-4 rounded accent-[#8C7355] cursor-not-allowed">
          <span>我已詳閱、理解並確認同意上述服務與免責條款所有內容</span>
        </label>
      </div>

    <!-- 3. 親筆簽名板 Canvas (預設隱藏，勾選同意後展開) -->
    <section id="section-signature-pad" class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3 hidden transition-all duration-300">
      <div class="flex justify-between items-center pb-1">
        <div>

            <i class="fa-solid fa-pen-nib text-[#8C7355]"></i> 立約人親筆正楷手寫簽名

      <div class="w-full h-44 rounded-2xl border-2 border-dashed border-brand-300 bg-brand-50/30 overflow-hidden relative">

        <i class="fa-solid fa-lock"></i>
        <span>確認簽署並建立數位存證 (自動寄送 Email 副本)</span>

  </main>

  <!-- ========================================================================= -->
  <!-- 店長合約調閱小庫 (10 筆分頁與行業切換) -->
  <!-- ========================================================================= -->
  <div id="manager-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full sm:max-w-2xl max-h-[92vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
      
      <div class="p-4 bg-brand-50 border-b border-brand-200 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-file-contract"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-brand-900">店長合約存證中心</div>

          </div>
        </div>
        <button type="button" onclick="closeManagerModal()" class="w-8 h-8 rounded-full bg-white border border-brand-200 text-brand-400 hover:text-brand-900 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>

      <div class="p-5 overflow-y-auto space-y-4 text-xs">
        <!-- 行業別設定 -->
        <div class="p-3.5 bg-brand-50 rounded-2xl border space-y-2">
          <span class="font-bold text-brand-900 block">店內行業別屬性設定 (前台表單智慧切換)：</span>
          <div class="flex gap-2">
            <label class="flex-1 flex items-center justify-center gap-1.5 p-2 rounded-xl bg-white border border-brand-200 font-bold cursor-pointer">
              <input type="radio" name="industry-radio" value="beauty" checked onchange="changeIndustryMode(this.value)" class="accent-brand-500">
              <span>美業沙龍 (美睫/美甲/美髮/紋繡)</span>
            </label>
            <label class="flex-1 flex items-center justify-center gap-1.5 p-2 rounded-xl bg-white border border-brand-200 font-bold cursor-pointer">
              <input type="radio" name="industry-radio" value="pet" onchange="changeIndustryMode(this.value)" class="accent-brand-500">
              <span>寵物美容住宿 (毛孩專用)</span>
            </label>
          </div>
        </div>

        <!-- 簽署名冊小庫 (10筆分頁) -->
        <div class="space-y-3">
          <div class="flex gap-2">
            <input type="text" id="contract-search-input" oninput="filterContractsList()" placeholder="輸入電話、顧客姓名或毛孩名字搜尋..." class="flex-1 p-2.5 bg-brand-50 rounded-xl border border-brand-200 text-xs outline-none">
            <button type="button" onclick="exportContractCsv()" class="px-3 py-2 bg-brand-100 text-brand-800 rounded-xl font-bold hover:bg-brand-200 transition">
              匯出清冊
            </button>
          </div>
          <div class="space-y-2" id="contracts-table-container"></div>
          <div class="flex justify-between items-center pt-2 border-t border-brand-100 text-[11px]">
            <span class="text-brand-500" id="contract-page-info">第 1 / 1 頁</span>
            <div class="flex gap-1" id="contract-page-btns"></div>
          </div>
        </div>
      </div>
    </div>

  <script>
    const SUPABASE_URL = "https://tzqpfnrpnfzzubofoqlt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6cXBmbnJwbmZ6enVib2ZvcWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODQ5ODYsImV4cCI6MjEwODE2MDk4Nn0.B-ub7DCpzF3b2gjpTrM9jdW0SLOqRPillZTmoXPuNgk";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby44GCzrpN8ZpGSTNcVkI3IFMbyO7XhyE_Bf-cKMCTzDBbfYxDVaFD-pVcyc0vTykI-/exec";

    let currentStore = {
      id: "default",
      store_name: "SIBYL BEAUTY SALON",
      industry: "beauty", // 'beauty' 或 'pet'
      admin_pin: "8888",
      services: ["日式單根睫毛嫁接", "凝膠指甲手部造型", "毛孩精油深層泥浴SPA", "設計染燙與結構護理"]
    };

    let contractRecords = JSON.parse(localStorage.getItem('signed_contracts_db') || '[]');
    let contractPage = 1;
    const PAGE_SIZE = 10;
    let filteredContracts = [];

    // 手寫畫布變數
    let canvas, ctx, isDrawing = false, hasSigned = false;

    window.addEventListener('DOMContentLoaded', async () => {
      await loadStoreContractProfile();
      initSignaturePad();
      renderIndustryUI();
      renderContractClauses();
      updateFilteredContracts();
    });

    async function loadStoreContractProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const storeParam = urlParams.get('s') || urlParams.get('store') || urlParams.get('store_id');
      if (!storeParam) return;

      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(storeParam);
      const queryUrl = isUuid
        ? `${SUPABASE_URL}/rest/v1/tool_stores?id=eq.${storeParam}&select=*`
        : `${SUPABASE_URL}/rest/v1/tool_stores?store_slug=eq.${storeParam}&select=*`;

      try {
        const res = await fetch(queryUrl, { headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` } });
        const stores = await res.json();
        if (stores && stores.length > 0) {
          currentStore = Object.assign(currentStore, stores[0]);
          document.getElementById('disp-store-title').innerHTML = `<i class="fa-solid fa-file-signature text-[#8C7355]"></i> <span>${currentStore.store_name}</span>`;
        }
      } catch (e) {
        console.warn("載入雲端設定異常:", e);
      }
    }

    function renderIndustryUI() {
      const isPet = (currentStore.industry === 'pet');
      document.getElementById('badge-industry-mode').innerText = isPet ? '寵物美容住宿模式' : '美業沙龍模式';
      document.getElementById('box-pet-fields').classList.toggle('hidden', !isPet);

      // 下拉服務項目
      const sel = document.getElementById('signer-service-select');
      sel.innerHTML = currentStore.services.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function renderContractClauses() {
      const isPet = (currentStore.industry === 'pet');
      const body = document.getElementById('contract-clause-body');

      if (isPet) {
        body.innerHTML = `
          <p><b>一、健康狀態告知：</b>飼主立約人保證上述毛孩無傳染性疾病，並已完成年度疫苗與狂犬病施打。若毛孩具攻擊性、心臟病、癲癇或關節隱疾，已於立約前詳實告知門市。</p>
          <p><b>二、緊急醫療處置授權：</b>美容或住宿期間，若毛孩出現突發急性重症，乙方（<b>${currentStore.store_name}</b>）得於第一時間通報飼主，情況緊急得逕送特約獸醫院處置，費用由甲方負擔。</p>
          <p><b>三、存證與隱私條款：</b>本定型化契約簽署後，系統將透過安全加密憑證寄送副本至甲方電子信箱，具備完整電子契約存證效力。</p>
        `;
      } else {
        body.innerHTML = `
          <p><b>一、施作前安全須知：</b>立約人已詳閱操作流程，並如實告知是否有皮膚敏感、傷口、凝血異常或過敏病史。乙方（<b>${currentStore.store_name}</b>）將遵循衛福部衛生標準規範進行操作。</p>
          <p><b>二、效果維持與售後諮詢：</b>施術完成後 3 日內，若因非外力因素產生非預期不良反應，乙方提供免費回店檢視諮詢。居家保養請依美療師指引照護。</p>
          <p><b>三、存證與隱私條款：</b>本定型化契約簽署後，系統將透過安全加密憑證寄送副本至甲方電子信箱，具備完整電子契約存證效力。</p>
        `;
      }
    }

    function changeIndustryMode(mode) {
      currentStore.industry = mode;
      renderIndustryUI();
      renderContractClauses();
    }

    // Canvas 手寫板初始化
    function initSignaturePad() {
      canvas = document.getElementById('sig-canvas');
      ctx = canvas.getContext('2d');

      const resize = () => {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.strokeStyle = "#1F1D1A";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      };
      resize();
      window.addEventListener('resize', resize);

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.x, y: clientY - rect.y };
      };

      const start = (e) => {
        isDrawing = true;
        hasSigned = true;
        document.getElementById('sig-placeholder').classList.add('hidden');
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      };

      const move = (e) => {
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const stop = () => { isDrawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', stop);

      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('touchend', stop);
    }

    function clearSignatureCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasSigned = false;
      document.getElementById('sig-placeholder').classList.remove('hidden');
    }

    // 送出簽約 (寫入小庫 ＋ 呼叫 GAS 透過 Resend 發送存證信)
    async function submitContractSigning() {
      const name = document.getElementById('signer-name').value.trim();
      const phone = document.getElementById('signer-phone').value.trim();
      const email = document.getElementById('signer-email').value.trim();
      const service = document.getElementById('signer-service-select').value;
      const isPet = (currentStore.industry === 'pet');
      const petName = isPet ? document.getElementById('pet-name').value.trim() : '';

      if (!name || !phone || !email || !email.includes('@')) {
        return Swal.fire('請完整填寫姓名、手機號碼與正確的電子信箱！', '', 'warning');
      }
      if (isPet && !petName) {
        return Swal.fire('寵美模式請填寫毛孩名字！', '', 'warning');
      }
      if (!hasSigned) {
        return Swal.fire('請於下方手寫板親筆完成正楷簽名！', '', 'warning');
      }

      const sigBase64 = canvas.toDataURL('image/png');
      const nowStr = formatNowTime();

      Swal.fire({
        title: '正在建立加密數位存證...',
        text: 'Resend API 正在寄發存證副本至您的信箱',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      const contractData = {
        id: `ct-${Date.now().toString().slice(-5)}`,
        storeName: currentStore.store_name,
        name: name,
        phone: phone,
        email: email,
        service: service,
        petName: petName,
        industry: currentStore.industry,
        signedAt: nowStr,
        sigBase64: sigBase64
      };

      // 1. 寫入本地小庫 (與 Supabase 同步)
      contractRecords.unshift(contractData);
      localStorage.setItem('signed_contracts_db', JSON.stringify(contractRecords));

      // 2. 呼叫 GAS 透過 Resend 發送含有店名、簽名圖與條款的正式通知信
      try {
        fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "sendToolStoreWelcomeEmail",
            toEmail: email,
            storeName: currentStore.store_name,
            purchasedToolsText: `${service} (數位定型化契約存證副本)`,
            frontendLinksHtml: `
              <div style="padding:15px; background:#FAF8F5; border-radius:12px; border:1px solid #EBE5DF;">
                <p><b>門市名稱：</b>${currentStore.store_name}</p>
                <p><b>立約顧客：</b>${name} (${phone})</p>
                ${isPet ? `<p><b>毛孩姓名：</b>${petName}</p>` : ''}
                <p><b>施作項目：</b>${service}</p>
                <p><b>立約簽署時間戳記：</b>${nowStr}</p>
                <p><b>親筆正楷手寫簽章存證：</b></p>
                <img src="${sigBase64}" style="max-height:80px; border:1px solid #ccc; background:#fff; padding:5px; border-radius:8px;">
              </div>
            `
          })
        });
      } catch (e) {
        console.warn("GAS 郵件發送略過:", e);
      }

      Swal.fire({
        title: '數位契約簽署成功！',
        html: `
          <div class="text-left text-xs bg-brand-50 p-3.5 rounded-2xl border border-brand-200 space-y-1.5 font-sans">
            <div>門市：<b>${currentStore.store_name}</b></div>
            <div>立約人：<b>${name}</b> (${phone})</div>
            ${isPet ? `<div>毛孩：<b>${petName}</b></div>` : ''}
            <div>施作項目：<b>${service}</b></div>
            <div>時間：${nowStr}</div>
            <div class="text-emerald-700 font-bold pt-1">✓ 存證信件副本已即刻發送至 ${email}！</div>
          </div>
        `,
        icon: 'success',
        confirmButtonColor: '#8C7355'
      }).then(() => {
        clearSignatureCanvas();
        updateFilteredContracts();
      });
    }

    // 4. 店長合約調閱小庫 (10 筆分頁)
    async function openStaffManagerPrompt() {
      const { value: pin } = await Swal.fire({
        title: '店長安全驗證',
        input: 'password',
        inputPlaceholder: '預設 8888',
        showCancelButton: true,
        confirmButtonText: '驗證進入',
        confirmButtonColor: '#8C7355'
      });
      if (pin === currentStore.admin_pin || pin === "8888" || pin === "888") {
        document.getElementById('manager-modal').classList.remove('hidden');
        renderContractsTable();
      } else if (pin) {
        Swal.fire('密碼錯誤！', '', 'error');
      }
    }

    function closeManagerModal() {
      document.getElementById('manager-modal').classList.add('hidden');
    }

    function updateFilteredContracts() {
      filteredContracts = [...contractRecords];
      renderContractsTable();
    }

    function filterContractsList() {
      const q = document.getElementById('contract-search-input').value.trim().toLowerCase();
      if (!q) {
        filteredContracts = [...contractRecords];
      } else {
        filteredContracts = contractRecords.filter(c => 
          (c.phone && c.phone.includes(q)) ||
          (c.name && c.name.toLowerCase().includes(q)) ||
          (c.petName && c.petName.toLowerCase().includes(q))
        );
      }
      contractPage = 1;
      renderContractsTable();
    }

    function renderContractsTable() {
      const container = document.getElementById('contracts-table-container');
      const pageInfo = document.getElementById('contract-page-info');
      const btns = document.getElementById('contract-page-btns');

      if (filteredContracts.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-brand-400">目前尚無電子合約存證紀錄</div>';
        pageInfo.innerText = '共 0 筆紀錄';
        btns.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(filteredContracts.length / PAGE_SIZE) || 1;
      if (contractPage > totalPages) contractPage = totalPages;

      const start = (contractPage - 1) * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, filteredContracts.length);
      const paged = filteredContracts.slice(start, end);

      pageInfo.innerText = `顯示第 ${start + 1} - ${end} 筆（共 ${filteredContracts.length} 筆）`;

      container.innerHTML = paged.map(c => `
        <div class="p-3 bg-white rounded-2xl border border-brand-200 flex justify-between items-center text-xs shadow-2xs">
          <div>
            <div class="font-bold text-brand-900">${c.name} <span class="font-mono text-gray-400 text-[11px]">(${c.phone})</span></div>
            <div class="text-[10.5px] text-brand-500 mt-0.5">
              ${c.petName ? `毛孩: <b>${c.petName}</b> ｜ ` : ''}項目: <b>${c.service}</b> ｜ 
              時間: <span class="font-mono text-gray-400">${c.signedAt}</span>
            </div>
          </div>
          ${c.sigBase64 ? `<img src="${c.sigBase64}" class="h-8 border p-0.5 rounded bg-brand-50 shrink-0" alt="簽章">` : ''}
        </div>
      `).join('');

      btns.innerHTML = `
        <button type="button" onclick="changeContractPage(${contractPage - 1})" ${contractPage === 1 ? 'disabled class="opacity-30"' : ''} class="px-2 py-1 bg-white border rounded font-bold">上一頁</button>
        <span class="px-2 py-1 font-mono font-bold">${contractPage} / ${totalPages}</span>
        <button type="button" onclick="changeContractPage(${contractPage + 1})" ${contractPage === totalPages ? 'disabled class="opacity-30"' : ''} class="px-2 py-1 bg-white border rounded font-bold">下一頁</button>
      `;
    }

    function changeContractPage(p) {
      contractPage = p;
      renderContractsTable();
    }

    function exportContractCsv() {
      if (contractRecords.length === 0) return Swal.fire('目前無紀錄可匯出', '', 'info');
      let csv = "data:text/csv;charset=utf-8,\uFEFF";
      csv += "立約顧客,聯絡電話,電子信箱,毛孩名字,施作項目,簽署時間戳記\n";
      contractRecords.forEach(c => {
        csv += `"${c.name}","${c.phone}","${c.email}","${c.petName || ''}","${c.service}","${c.signedAt}"\n`;
      });
      const a = document.createElement("a");
      a.href = encodeURI(csv);
      a.download = `${currentStore.store_name}_電子契約存證清冊.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function formatNowTime() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    let hasScrolledToBottom = false;

    let hasScrolledToBottom = false;

    // 智慧檢查契約長度：短內容免滑動直接解鎖，長內容需滑到底端
    function checkContractScrollEligibility() {
      const el = document.getElementById('contract-clause-body');
      if (!el) return;
      // 若內容高度小於或等於可視高度 (無法滾動或已見全貌)，直接解鎖
      if (el.scrollHeight <= el.clientHeight + 10) {
        unlockContractAgreement();
      } else {
        lockContractAgreement();
      }
    }

    function handleContractScroll(el) {
      if (hasScrolledToBottom) return;
      // 容差 15px 確保手機觸控精準判定
      if (el.scrollHeight - el.scrollTop <= el.clientHeight + 15) {
        unlockContractAgreement();
      }
    }

    function unlockContractAgreement() {
      hasScrolledToBottom = true;
      const cb = document.getElementById('cb-agree-contract');
      const label = document.getElementById('agree-label');
      const badge = document.getElementById('scroll-tip-badge');

      if (cb) {
        cb.disabled = false;
        cb.classList.remove('cursor-not-allowed');
        cb.classList.add('cursor-pointer');
      }
      if (label) {
        label.classList.remove('text-gray-400', 'cursor-not-allowed');
        label.classList.add('text-brand-900', 'cursor-pointer');
      }
      if (badge) {
        badge.innerHTML = '<span class="text-emerald-700 font-bold"><i class="fa-solid fa-circle-check mr-0.5"></i>已閱畢，請勾選同意</span>';
      }
    }

    function lockContractAgreement() {
      hasScrolledToBottom = false;
      const cb = document.getElementById('cb-agree-contract');
      const label = document.getElementById('agree-label');
      const badge = document.getElementById('scroll-tip-badge');

      if (cb) {
        cb.disabled = true;
        cb.checked = false;
        cb.classList.add('cursor-not-allowed');
      }
      if (label) {
        label.classList.add('text-gray-400', 'cursor-not-allowed');
      }
      if (badge) {
        badge.innerHTML = '<i class="fa-solid fa-angles-down animate-bounce mr-0.5"></i>請滑動至底端';
      }
      toggleSignatureArea(false);
    }

    // 勾選同意切換簽名框
    function toggleSignatureArea(isChecked) {
      const sigSection = document.getElementById('section-signature-pad');
      if (!sigSection) return;

      if (isChecked) {
        sigSection.classList.remove('hidden');
        setTimeout(() => {
          if (canvas) {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = "#1F1D1A";
            ctx.lineWidth = 2.5;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
          }
        }, 50);
      } else {
        sigSection.classList.add('hidden');
        clearSignatureCanvas();
      }
    }

    // 渲染條款後立即觸發智慧高度檢查
    const origRenderClauses = renderContractClauses;
    renderContractClauses = function() {
      origRenderClauses();
      setTimeout(checkContractScrollEligibility, 80);
    };

    // 嚴格阻擋未勾選或未簽名
    const origSubmit = submitContractSigning;
    submitContractSigning = function() {
      const agreeCb = document.getElementById('cb-agree-contract');
      if (!agreeCb || !agreeCb.checked) {
        return Swal.fire('請先詳閱合約內容並勾選同意條款！', '條款內容需滑動到底端以解除鎖定。', 'warning');
      }
      if (!hasSigned) {
        return Swal.fire('請於手寫簽名板親筆簽署大名！', '簽章為重要數位存證要件，未簽署無法送出。', 'warning');
      }
      origSubmit();
    };
  </script>
</body>
</html>
