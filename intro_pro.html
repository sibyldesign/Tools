<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>課程預約與品牌專屬頁 | Sibyl 數位管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #F4EFE8;
            --bg-card: rgba(255, 255, 255, 0.78);
            --bg-soft: rgba(239, 232, 222, 0.72);
            --text-main: #3A312B;
            --text-muted: #7A6D64;
            --primary: #8C735B;
            --primary-glow: rgba(140, 115, 91, 0.22);
            --primary-text: #FFFFFF;
            --border-color: rgba(255, 255, 255, 0.85);
            --border-subtle: rgba(140, 115, 91, 0.14);
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-3d-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            box-shadow: 
                0 18px 38px -12px rgba(61, 52, 46, 0.08),
                0 4px 12px -2px rgba(61, 52, 46, 0.03),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
        }

        .soft-block {
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        .theme-btn-primary {
            background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 85%, #1a1512));
            color: var(--primary-text);
            box-shadow: 0 10px 22px -6px var(--primary-glow), inset 0 1px 1px rgba(255, 255, 255, 0.35);
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .theme-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -6px var(--primary-glow); }
        .theme-btn-primary:active { transform: scale(0.97) translateY(0); }

        .theme-text-muted { color: var(--text-muted); }
        .theme-text-primary { color: var(--primary); }

        .ratio-4-5 { aspect-ratio: 4 / 5; }
        .ratio-9-12 { aspect-ratio: 9 / 12; }
        .ratio-1-1 { aspect-ratio: 1 / 1; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 3D 立體資料夾凸起標籤 */
        .folder-tab {
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
        }
        .folder-tab.active {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            color: var(--primary);
            font-weight: 700;
            transform: translateY(0);
            box-shadow: 0 -6px 16px -4px rgba(61, 52, 46, 0.06);
            z-index: 20;
        }
        .folder-tab.inactive {
            background: var(--bg-soft);
            color: var(--text-muted);
            transform: translateY(3px);
            opacity: 0.85;
        }
        .folder-tab.inactive:hover { transform: translateY(1px); opacity: 1; }

        /* 月曆格子懸停與點擊 3D 微互動 */
        .cal-day-btn { transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .cal-day-available:hover {
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 8px 16px -4px var(--primary-glow);
            background-color: #FFFFFF;
        }
        .cal-day-selected {
            background: var(--primary);
            color: #FFFFFF;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 20px -5px var(--primary-glow);
        }

        /* 捲動漸現動畫 */
        .reveal-block {
            opacity: 0;
            transform: translateY(22px) scale(0.985);
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal-block.is-visible { opacity: 1; transform: translateY(0) scale(1); }

        @keyframes cartPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        .cart-pop-anim { animation: cartPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-28 relative">

    <!-- 背景立體柔焦色塊 -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
        <div class="absolute -top-24 -left-20 w-80 h-80 rounded-full opacity-45 blur-3xl transition-colors duration-500" style="background: var(--primary-glow);"></div>
        <div class="absolute top-1/3 -right-24 w-72 h-72 rounded-full bg-white/60 blur-3xl"></div>
        <div class="absolute bottom-10 left-10 w-64 h-64 rounded-full opacity-35 blur-3xl transition-colors duration-500" style="background: var(--primary-glow);"></div>
    </div>

    <!-- 前台頂部狀態列 (完全隱藏後台入口，確保個資隔離) -->
    <header class="w-full max-w-md px-5 pt-5 pb-2 flex justify-between items-center z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full glass-3d-card text-[11px] font-medium theme-text-muted">
            <span class="w-2 h-2 rounded-full animate-pulse" style="background-color: var(--primary);"></span>
            <span id="frontTopBadgeText" class="tracking-wider">OFFICIAL BOOKING</span>
        </div>
        <button onclick="openOrderLookup()" class="flex items-center gap-1.5 text-xs px-3.5 py-1.5 rounded-full glass-3d-card theme-text-muted hover:scale-105 active:scale-95 transition">
            <i data-lucide="receipt" class="w-3.5 h-3.5 theme-text-primary"></i>
            <span class="font-medium">查詢與回報匯款</span>
        </button>
    </header>

    <main class="w-full max-w-md px-5 space-y-6 flex-1 z-10">

        <!-- 1. 立體層疊品牌門面區 -->
        <section class="glass-3d-card rounded-[32px] p-7 text-center relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-20 opacity-35 pointer-events-none" style="background: linear-gradient(180deg, var(--primary-glow), transparent);"></div>

            <div class="relative w-28 h-28 mx-auto mb-4">
                <div class="w-full h-full rounded-[26px] p-1.5 bg-white/90 shadow-md ring-1 ring-black/5">
                    <div class="w-full h-full rounded-[20px] overflow-hidden soft-block flex items-center justify-center">
                        <img id="frontAvatar" src="" alt="品牌頭像" class="w-full h-full object-cover hidden transition-transform duration-500 hover:scale-105">
                        <i id="frontAvatarPlaceholder" data-lucide="sparkles" class="w-9 h-9 theme-text-primary"></i>
                    </div>
                </div>
                <div class="absolute -bottom-1.5 -right-1.5 w-8 h-8 rounded-xl theme-btn-primary flex items-center justify-center shadow-md ring-2 ring-white">
                    <i data-lucide="badge-check" class="w-4 h-4"></i>
                </div>
            </div>

            <h1 id="frontBrandName" class="text-xl font-bold tracking-wide mb-1.5">載入中...</h1>
            
            <div class="inline-flex items-center justify-center gap-1.5 px-3 py-1 rounded-full soft-block mb-4">
                <i data-lucide="compass" class="w-3.5 h-3.5 theme-text-primary shrink-0"></i>
                <p id="frontTagline" class="text-xs font-medium theme-text-primary tracking-wider"></p>
            </div>

            <div class="soft-block rounded-2xl p-4 text-left relative">
                <i data-lucide="quote" class="w-4 h-4 theme-text-primary opacity-40 mb-1"></i>
                <p id="frontBio" class="text-[13px] leading-relaxed theme-text-muted whitespace-pre-line"></p>
            </div>

            <div id="frontLinksContainer" class="mt-5 pt-5 border-t border-black/5"></div>
        </section>

        <!-- 2. 多比例作品與環境輪播牆 (支援點擊白點切換 + 左右微調) -->
        <section id="carouselSection" class="glass-3d-card rounded-[32px] p-4">
            <div class="flex items-center justify-between mb-3 px-1.5">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="image" class="w-4 h-4 theme-text-primary"></i>
                    <h2 id="frontCarouselTitle" class="text-sm font-bold tracking-wide">課程花絮與實績展示</h2>
                </div>
                <span id="carouselCounter" class="text-[11px] px-2.5 py-0.5 rounded-full soft-block theme-text-muted font-semibold">1 / 1</span>
            </div>
            <div class="relative rounded-2xl overflow-hidden soft-block shadow-inner group">
                <div id="carouselTrack" class="flex overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar"></div>
                <button onclick="moveSlide(-1)" id="prevSlideBtn" class="hidden absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/85 backdrop-blur-md flex items-center justify-center shadow-md text-stone-700 hover:scale-110 transition">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <button onclick="moveSlide(1)" id="nextSlideBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/85 backdrop-blur-md flex items-center justify-center shadow-md text-stone-700 hover:scale-110 transition">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="carouselDots" class="flex justify-center items-center gap-2 mt-3.5"></div>
        </section>

        <!-- 3. 完整 5 大高轉換價值鋪陳模組 (數據成果牆 + 痛點檢核 + Before/After + 適合對象 + 學員見證) -->
        <section id="salesModulesContainer" class="space-y-4">
            <!-- 動態渲染 -->
        </section>

        <!-- 4. 分層資料夾式課程介紹與選課區 -->
        <section id="coursesSection" class="pt-1">
            <div class="flex items-center gap-1.5 mb-3 px-1">
                <i data-lucide="folder-open" class="w-4 h-4 theme-text-primary"></i>
                <h2 id="frontFolderTitle" class="text-sm font-bold tracking-wide">課程與服務項目（可勾選單堂或多堂）</h2>
            </div>

            <!-- 資料夾上方凸起標籤列 -->
            <div id="folderTabsRow" class="flex items-end gap-1.5 overflow-x-auto no-scrollbar px-1 -mb-[1px] relative z-10"></div>

            <!-- 資料夾內容卡片框 -->
            <div class="glass-3d-card rounded-b-[32px] rounded-tr-[32px] p-4 space-y-3 relative z-0">
                <div id="courseCardsList" class="space-y-3"></div>
            </div>
        </section>

        <!-- 5. 互動式空檔與開課月曆 (單堂約空檔 / 多堂選場次) -->
        <section class="glass-3d-card rounded-[32px] p-5">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="calendar-check" class="w-4 h-4 theme-text-primary"></i>
                    <h2 id="frontCalendarTitle" class="text-sm font-bold tracking-wide">選擇上課日期與場次</h2>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="changeMonth(-1)" class="p-1.5 rounded-xl soft-block hover:opacity-80"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <span id="currentMonthLabel" class="text-xs font-semibold px-2 min-w-[76px] text-center"></span>
                    <button onclick="changeMonth(1)" class="p-1.5 rounded-xl soft-block hover:opacity-80"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-7 text-center text-[11px] theme-text-muted font-medium mb-2">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 text-center"></div>

            <div class="mt-4 pt-4 border-t border-black/5">
                <p id="selectedDateTitle" class="text-xs font-bold mb-2.5">請點選有圓點標記的日期查看場次</p>
                <div id="dailySlotsList" class="space-y-2.5"></div>
            </div>
        </section>

        <!-- 6. 常見問題 FAQ -->
        <section id="faqSection" class="glass-3d-card rounded-[32px] p-5">
            <div class="flex items-center gap-1.5 mb-3">
                <i data-lucide="help-circle" class="w-4 h-4 theme-text-primary"></i>
                <h2 id="frontFaqTitle" class="text-sm font-bold tracking-wide">報名與退改期須知</h2>
            </div>
            <div id="frontFaqList" class="divide-y border-black/5"></div>
        </section>

    </main>

    <!-- 固定頁尾 -->
    <footer class="w-full py-6 text-center z-10">
        <a href="https://heysibyl.com" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs theme-text-muted hover:opacity-75">
            <span>Designed by Sibyl</span>
            <span>|</span>
            <span>數位管家</span>
        </a>
    </footer>

    <!-- 底部浮動多堂選課結算列 -->
    <div id="floatingCartBar" class="fixed bottom-0 inset-x-0 z-40 p-3 bg-white/95 backdrop-blur-md border-t border-stone-200 shadow-lg hidden">
        <div class="max-w-md mx-auto flex items-center justify-between gap-3">
            <div>
                <p class="text-xs font-bold text-stone-800">已選取 <span id="cartCount" class="theme-text-primary inline-block">0</span> 堂課程</p>
                <p id="cartPriceDisplay" class="text-xs text-stone-500">總計 NT$ 0</p>
            </div>
            <button onclick="openCheckoutModal()" class="px-5 py-2.5 rounded-xl theme-btn-primary text-xs font-semibold flex items-center gap-1.5">
                <span>下一步填寫報名資料</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </div>

    <!-- 報名結帳與匯款後五碼回報彈窗 -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto text-stone-800 space-y-4">
            <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                <h3 class="text-sm font-bold flex items-center gap-1.5">
                    <i data-lucide="clipboard-check" class="w-4 h-4 theme-text-primary"></i>
                    <span>確認選課明細與報名資料</span>
                </h3>
                <button onclick="closeModal('checkoutModal')" class="p-1 text-stone-400"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <div id="checkoutSummaryList" class="space-y-2 bg-stone-50 p-3 rounded-2xl border border-stone-100 text-xs"></div>

            <div id="checkoutFormFields" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">學員姓名 *</label>
                    <input type="text" id="custName" placeholder="請輸入真實姓名" class="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">聯絡手機 *</label>
                        <input type="tel" id="custPhone" placeholder="0912345678" class="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">LINE 顯示名稱 *</label>
                        <input type="text" id="custLine" placeholder="方便核對通知" class="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">備註或想詢問的問題（選填）</label>
                    <input type="text" id="custNote" placeholder="例如：希望安排線上視訊" class="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm">
                </div>

                <div id="bankInfoBox" class="hidden p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200/80 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-stone-800">匯款轉帳資訊</span>
                        <button type="button" onclick="copyBankAccount()" class="px-2.5 py-1 rounded-lg bg-white border border-stone-200 text-[11px] font-medium flex items-center gap-1 shadow-2xs">
                            <i data-lucide="copy" class="w-3 h-3"></i>
                            <span>複製帳號</span>
                        </button>
                    </div>
                    <p id="bankDetailText" class="text-xs text-stone-700 font-mono"></p>
                    <div class="pt-1">
                        <label class="block text-[11px] font-medium text-stone-600 mb-1">匯款帳號後五碼（若稍後匯款可先留空，稍後再填）</label>
                        <input type="text" id="custLast5" maxlength="5" placeholder="例如：12345" class="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm bg-white">
                    </div>
                </div>

                <button onclick="submitBookingOrder()" class="w-full py-3 rounded-xl theme-btn-primary text-xs font-bold">
                    送出預約報名
                </button>
            </div>

            <div id="bookingSuccessView" class="hidden text-center py-4 space-y-3">
                <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 mx-auto flex items-center justify-center">
                    <i data-lucide="check" class="w-6 h-6"></i>
                </div>
                <h4 class="text-base font-bold">預約申請已送出</h4>
                <p class="text-xs text-stone-500">您的訂單編號：<span id="createdBookingNo" class="font-mono font-bold text-stone-800"></span></p>
                <p class="text-xs text-stone-500 leading-relaxed">系統已自動複製您的預約明細，點擊下方按鈕開啟老師的 LINE 貼上送出，即可加速核對：</p>
                <button onclick="openProOwnerLine()" class="w-full py-2.5 rounded-xl theme-btn-primary text-xs font-bold flex items-center justify-center gap-1.5">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                    <span>開啟老師 LINE 傳送預約明細</span>
                </button>
                <button onclick="closeModal('checkoutModal')" class="w-full py-2 rounded-xl bg-stone-100 text-stone-600 text-xs font-medium">完成並返回頁面</button>
            </div>
        </div>
    </div>

    <!-- 學員查詢訂單與補填匯款後五碼彈窗 -->
    <div id="lookupModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden items-center justify-center p-5">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 text-stone-800 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold">查詢報名與回報匯款後五碼</h3>
                <button onclick="closeModal('lookupModal')" class="p-1 text-stone-400"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <input type="tel" id="lookupPhone" placeholder="請輸入報名時填寫的手機號碼" class="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs">
            <button onclick="searchMyOrders()" class="w-full py-2.5 rounded-xl theme-btn-primary text-xs font-bold">查詢紀錄</button>
            <div id="lookupResults" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // 質感自訂提示窗 (消滅醜陋原生 alert 與預設按鈕色)
        window.alert = function(msg) {
            let box = document.getElementById('sibylCustomAlert');
            if (!box) {
                box = document.createElement('div');
                box.id = 'sibylCustomAlert';
                box.className = 'fixed inset-0 bg-black/40 backdrop-blur-xs z-[99] flex items-center justify-center p-5';
                box.innerHTML = `
                    <div class="bg-white rounded-3xl w-full max-w-xs p-6 shadow-xl text-center space-y-4 border border-stone-100">
                        <p id="sibylAlertMsg" class="text-xs text-stone-700 leading-relaxed font-medium whitespace-pre-line"></p>
                        <button onclick="document.getElementById('sibylCustomAlert').classList.add('hidden')" 
                            class="w-full py-2.5 rounded-xl text-xs font-bold text-white shadow-sm transition hover:opacity-90"
                            style="background-color: var(--primary, #8C735B);">
                            我知道了
                        </button>
                    </div>`;
                document.body.appendChild(box);
            }
            document.getElementById('sibylAlertMsg').textContent = msg;
            box.classList.remove('hidden');
        };

        const SUPABASE_URL = "https://tzqpfnrpnfzzubofoqlt.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Gd2bvnjN9_wy-x2VkkQzaw_S_gfqJHG";
        const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY)
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null;

        const urlParams = new URLSearchParams(window.location.search);
        const CARD_SLUG = urlParams.get('id') || 'demo';
        const REF_PARAM = urlParams.get('ref');

                    const defaultSm = cardData.sales_modules;
                    const defaultLinks = cardData.social_links;
                    const defaultCarousel = cardData.carousel_items;

                    cardData = { ...cardData, ...card };
                    cardData.sales_modules = {
                        ...defaultSm,
                        ...(card.sales_modules || {}),
                        titles: { ...defaultSm.titles, ...(card.sales_modules?.titles || {}) }
                    };

                    // 防呆：若雲端尚未設定社群連結或輪播圖，保留預設示範項目避免畫面空白
                    if (!card.social_links || card.social_links.length === 0) {
                        cardData.social_links = defaultLinks;
                    }
                    if (!card.carousel_items || card.carousel_items.length === 0) {
                        cardData.carousel_items = defaultCarousel;

        function renderLinks() {
            const box = document.getElementById('frontLinksContainer');
            const links = cardData.social_links || [];
            if (!links.length) {
                box.classList.add('hidden');
                return;
            }
            box.classList.remove('hidden');

            const icons = links.filter(l => !l.style || l.style === 'icon_only');
            const blocks = links.filter(l => l.style && l.style !== 'icon_only');
            let html = '';

            if (blocks.length) {
                html += `<div class="space-y-2.5 mb-3">` + blocks.map(l => `

            }

        function renderCarousel() {
            const items = cardData.carousel_items || [];
            const sec = document.getElementById('carouselSection');
            if (!items.length) return sec.classList.add('hidden');
            sec.classList.remove('hidden');

            const ratioClass = cardData.carousel_ratio === '9:12' ? 'ratio-9-12' : cardData.carousel_ratio === '1:1' ? 'ratio-1-1' : 'ratio-4-5';
            const track = document.getElementById('carouselTrack');
            track.innerHTML = items.map(it => `
                <div class="w-full shrink-0 snap-center ${ratioClass}">
                    <img src="${it.url}" class="w-full h-full object-cover">
                </div>
            `).join('');

            document.getElementById('prevSlideBtn').classList.toggle('hidden', items.length <= 1);
            document.getElementById('nextSlideBtn').classList.toggle('hidden', items.length <= 1);
            updateCarouselDots();

            track.onscroll = () => {
                const index = Math.round(track.scrollLeft / track.clientWidth);
                if (index !== currentSlide && index >= 0 && index < items.length) {
                    currentSlide = index;
                    updateCarouselDots();
                }
            };
        }

        function updateCarouselDots() {
            const items = cardData.carousel_items || [];
            document.getElementById('carouselDots').innerHTML = items.map((_, i) => `
                <button onclick="goToSlide(${i})" aria-label="切換至第 ${i + 1} 張"
                    class="h-2 rounded-full transition-all duration-300 cursor-pointer ${i === currentSlide ? 'w-6 bg-white shadow-sm ring-1 ring-black/15' : 'w-2 bg-stone-400/50 hover:bg-stone-400'}">
                </button>
            `).join('');
            document.getElementById('carouselCounter').textContent = `${currentSlide + 1} / ${items.length}`;
        }

        function goToSlide(idx) {
            const track = document.getElementById('carouselTrack');
            currentSlide = idx;
            track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' });
            updateCarouselDots();
        }

        function moveSlide(step) {
            const total = (cardData.carousel_items || []).length;
            if (total <= 1) return;
            goToSlide((currentSlide + step + total) % total);
        }

                        <h3 class="text-xs font-bold tracking-wide flex items-center gap-1.5">
                            <i data-lucide="user-check" class="w-4 h-4 theme-text-primary"></i>
                            <span>${t.fit || '這套課程與諮詢適合誰？'}</span>
                        </h3>
                        <div class="space-y-2.5 text-xs">
                            <div class="p-3 rounded-2xl soft-block space-y-1">
                                <p class="font-bold theme-text-primary text-[11px]">推薦給這樣的妳：</p>
                                ${(sm.fit_check.suitable || []).map(s => `<p class="theme-text-main leading-snug">＋ ${s}</p>`).join('')}
                            </div>
                            <div class="p-3 rounded-2xl bg-stone-100/70 space-y-1">
                                <p class="font-bold text-stone-500 text-[11px]">暫時不適合的對象：</p>
                                ${(sm.fit_check.not_suitable || []).map(ns => `<p class="text-stone-500 leading-snug">－ ${ns}</p>`).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            // 5. 學員與個案好評見證語錄
            if (sm.enable_testimonials && sm.testimonials?.length) {
                html += `
                    <div class="glass-3d-card rounded-[32px] p-5 space-y-3">
                        <h3 class="text-xs font-bold tracking-wide flex items-center gap-1.5">
                            <i data-lucide="message-square-quote" class="w-4 h-4 theme-text-primary"></i>
                            <span>${t.testimonials || '來自學員與個案的真實回饋'}</span>
                        </h3>
                        <div class="space-y-2.5">` + sm.testimonials.map(tm => `
                            <div class="p-3.5 rounded-2xl soft-block space-y-1">
                                <p class="text-xs theme-text-main leading-relaxed">「${tm.text}」</p>
                                <p class="text-[11px] font-bold theme-text-primary text-right">— ${tm.name}</p>
                            </div>
                        `).join('') + `</div>
                    </div>`;
            }

            box.innerHTML = html;
        }

        function renderFolderTabs() {
            const row = document.getElementById('folderTabsRow');
            row.innerHTML = tabs.map(t => `
                <button onclick="selectFolderTab('${t.id}')" 
                    class="folder-tab px-4 py-2 text-xs whitespace-nowrap ${t.id === activeTabId ? 'active' : 'inactive'}">
                    ${t.tab_name}
                </button>
            `).join('');
        }

        function selectFolderTab(tabId) {
            activeTabId = tabId;
            renderFolderTabs();
            renderCourseCards();
            lucide.createIcons();
        }

        function renderCourseCards() {
            const list = document.getElementById('courseCardsList');
            const filtered = courses.filter(c => c.tab_id === activeTabId);

            if (!filtered.length) {
                list.innerHTML = `<p class="text-xs theme-text-muted text-center py-4">此分類暫無開放課程</p>`;
                return;
            }

            list.innerHTML = filtered.map(c => {
                const courseSchedules = schedules.filter(s => s.course_id === c.id);
                const priceTag = cardData.enable_ordering ? `<span class="text-sm font-bold theme-text-primary">NT$ ${c.price.toLocaleString()}</span>` : '';

                const slotsHtml = courseSchedules.map(s => {
                    const remain = s.max_capacity - s.booked_count;
                    const isFull = remain <= 0;
                    const isChecked = selectedCart.some(item => item.schedule_id === s.id);
                    return `
                        <label class="flex items-center justify-between p-2.5 rounded-xl border border-black/5 text-xs cursor-pointer transition ${isFull ? 'opacity-40 pointer-events-none bg-stone-50' : isChecked ? 'soft-block font-semibold ring-1 ring-stone-400' : 'bg-white/90 hover:bg-white'}">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleScheduleCart('${s.id}')" class="rounded text-stone-800">
                                <span>${s.schedule_date} (${s.start_time}-${s.end_time})</span>
                            </div>
                            <span class="text-[11px] theme-text-muted">${isFull ? '已額滿' : `剩 ${remain} 名`}</span>
                        </label>
                    `;
                }).join('');

                return `
                    <div class="p-4 rounded-2xl soft-block space-y-2.5">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                ${c.badge_text ? `<span class="inline-block text-[10px] px-2.5 py-0.5 rounded-full theme-btn-primary mb-1.5">${c.badge_text}</span>` : ''}
                                <h3 class="text-sm font-bold">${c.title}</h3>
                                <p class="text-[11px] theme-text-muted">${c.subtitle || ''}</p>
                            </div>
                            ${priceTag}
                        </div>
                        <p class="text-xs theme-text-muted leading-relaxed">${c.description || ''}</p>
                        <div class="space-y-1.5 pt-1">
                            <p class="text-[11px] font-semibold theme-text-muted">勾選場次（可複選多堂）：</p>
                            ${slotsHtml || '<p class="text-[11px] theme-text-muted">暫無開放場次</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCalendar() {
            document.getElementById('currentMonthLabel').textContent = `${viewYear}年 ${viewMonth + 1}月`;
            const grid = document.getElementById('calendarGrid');
            const firstDay = new Date(viewYear, viewMonth, 1).getDay();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const openDates = new Set(schedules.map(s => s.schedule_date));

            let html = '';
            for (let i = 0; i < firstDay; i++) html += `<div class="h-11"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const hasSlot = openDates.has(dateStr);
                const isSel = selectedDateStr === dateStr;
                const stateClass = isSel ? 'cal-day-selected font-bold' : hasSlot ? 'cal-day-available soft-block font-semibold cursor-pointer' : 'opacity-35 cursor-default';

                html += `
                    <button onclick="selectCalendarDate('${dateStr}')" class="cal-day-btn h-11 rounded-2xl flex flex-col items-center justify-center text-xs ${stateClass}">
                        <span>${d}</span>
                        ${hasSlot ? `<span class="w-1.5 h-1.5 rounded-full mt-0.5 ${isSel ? 'bg-white' : 'theme-text-primary bg-current'}"></span>` : ''}
                    </button>`;
            }
            grid.innerHTML = html;
            renderDailySlots();
        }

        function setupScrollReveal() {
            document.querySelectorAll('main > section').forEach((sec, idx) => {
                if (idx > 0) sec.classList.add('reveal-block');
            });
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('is-visible');
                });
            }, { threshold: 0.08 });
            document.querySelectorAll('.reveal-block').forEach(el => observer.observe(el));
        }

        function changeMonth(delta) {
            viewMonth += delta;
            if (viewMonth > 11) { viewMonth = 0; viewYear++; }
            if (viewMonth < 0) { viewMonth = 11; viewYear--; }
            renderCalendar();
        }

        function selectCalendarDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
        }

        function renderDailySlots() {
            document.getElementById('selectedDateTitle').textContent = `${selectedDateStr} 開放場次`;
            const list = document.getElementById('dailySlotsList');
            const daySlots = schedules.filter(s => s.schedule_date === selectedDateStr);

            if (!daySlots.length) {
                list.innerHTML = `<p class="text-xs theme-text-muted">當日無排程場次</p>`;
                return;
            }

            list.innerHTML = daySlots.map(s => {
                const course = courses.find(c => c.id === s.course_id) || { title: '一對一預約時段', price: 0 };
                const remain = s.max_capacity - s.booked_count;
                const isChecked = selectedCart.some(item => item.schedule_id === s.id);
                return `
                    <label class="p-3.5 rounded-2xl bg-white/90 border border-white shadow-xs flex items-center justify-between cursor-pointer">
                        <div class="flex items-center gap-2.5">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} ${remain <= 0 ? 'disabled' : ''} onchange="toggleScheduleCart('${s.id}')">
                            <div>
                                <p class="text-xs font-bold">${course.title}</p>
                                <p class="text-[11px] theme-text-muted">${s.start_time} - ${s.end_time} ｜ ${s.location_tag || ''}</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold theme-text-primary">${cardData.enable_ordering ? `NT$ ${course.price}` : `剩 ${remain} 名`}</span>
                    </label>
                `;
            }).join('');
        }

        function toggleScheduleCart(scheduleId) {
            const existIdx = selectedCart.findIndex(item => item.schedule_id === scheduleId);
            if (existIdx > -1) {
                selectedCart.splice(existIdx, 1);
            } else {
                const s = schedules.find(x => x.id === scheduleId);
                const c = courses.find(x => x.id === s.course_id) || { id: null, title: '一對一諮詢時段', price: 0 };
                selectedCart.push({
                    schedule_id: s.id,
                    course_id: c.id,
                    course_title: c.title,
                    date: s.schedule_date,
                    time: `${s.start_time}-${s.end_time}`,
                    price: c.price
                });
            }
            updateFloatingCart();
            renderCourseCards();
            renderDailySlots();
        }

        function updateFloatingCart() {
            const bar = document.getElementById('floatingCartBar');
            if (selectedCart.length === 0) {
                bar.classList.add('hidden');
                return;
            }
            bar.classList.remove('hidden');
            const countEl = document.getElementById('cartCount');
            const total = selectedCart.reduce((sum, item) => sum + (item.price || 0), 0);
            
            countEl.textContent = selectedCart.length;
            countEl.classList.remove('cart-pop-anim');
            void countEl.offsetWidth;
            countEl.classList.add('cart-pop-anim');

            document.getElementById('cartPriceDisplay').textContent = cardData.enable_ordering 
                ? `總計 NT$ ${total.toLocaleString()}` 
                : `已選擇 ${selectedCart.length} 個時段`;
        }

        function renderFaqs() {
            const faqs = cardData.sales_modules?.faqs || [];
            document.getElementById('frontFaqList').innerHTML = faqs.map(f => `
                <details class="py-3 group">
                    <summary class="flex justify-between items-center text-xs font-semibold cursor-pointer list-none">
                        <span>${f.q}</span>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 theme-text-muted group-open:rotate-180 transition"></i>
                    </summary>
                    <p class="mt-2 text-xs theme-text-muted leading-relaxed">${f.a}</p>
                </details>
            `).join('');
        }

        function openCheckoutModal() {
            document.getElementById('checkoutFormFields').classList.remove('hidden');
            document.getElementById('bookingSuccessView').classList.add('hidden');

            const total = selectedCart.reduce((sum, it) => sum + (it.price || 0), 0);
            document.getElementById('checkoutSummaryList').innerHTML = selectedCart.map(it => `
                <div class="flex justify-between items-center py-1 border-b border-stone-200/60 last:border-none">
                    <div>
                        <p class="font-bold text-stone-800">${it.course_title}</p>
                        <p class="text-[11px] text-stone-500">${it.date} ${it.time}</p>
                    </div>
                    ${cardData.enable_ordering ? `<span class="font-semibold">NT$ ${it.price.toLocaleString()}</span>` : ''}
                </div>
            `).join('') + (cardData.enable_ordering ? `<div class="pt-2 text-right font-bold text-sm theme-text-primary">應付總金額：NT$ ${total.toLocaleString()}</div>` : '');

            const bankBox = document.getElementById('bankInfoBox');
            if (cardData.enable_ordering) {
                bankBox.classList.remove('hidden');
                document.getElementById('bankDetailText').textContent = `(${cardData.bank_code}) ${cardData.bank_name} ｜ 帳號：${cardData.bank_account} ｜ 戶名：${cardData.account_holder}`;
            } else {
                bankBox.classList.add('hidden');
            }

            const modal = document.getElementById('checkoutModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        }

        function copyBankAccount() {
            navigator.clipboard.writeText(cardData.bank_account || '');
            alert('匯款帳號已複製到剪貼簿');
        }

        async function submitBookingOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const line = document.getElementById('custLine').value.trim();
            const note = document.getElementById('custNote').value.trim();
            const last5 = document.getElementById('custLast5').value.trim();

            if (!name || !phone || !line) return alert('請完整填寫姓名、手機與 LINE 名稱');

            let refCode = null;
            try {
                const storedRef = JSON.parse(localStorage.getItem(`sibyl_ref_${CARD_SLUG}`));
                if (storedRef && storedRef.expires > Date.now()) refCode = storedRef.code;
            } catch (e) {}

            const bookingNo = 'BK' + Date.now().toString().slice(-8);
            const totalAmount = selectedCart.reduce((sum, it) => sum + (it.price || 0), 0);

            const orderPayload = {
                booking_no: bookingNo,
                card_id: cardData.id,
                customer_name: name,
                customer_phone: phone,
                customer_line: line,
                customer_note: note,
                selected_items: selectedCart,
                total_sessions: selectedCart.length,
                total_amount: totalAmount,
                requires_payment: cardData.enable_ordering,
                payment_status: !cardData.enable_ordering ? 'free' : (last5.length === 5 ? 'reported' : 'unpaid'),
                remittance_last5: last5 || null,
                ref_code: refCode
            };

            if (supabaseClient) {
                await supabaseClient.from('pro_bookings').insert([orderPayload]);
            }

            const itemsDetail = orderPayload.selected_items.map(i => `${i.course_title} (${i.date} ${i.time})`).join('\n・');
            window.lastOrderMsg = `您好！我已完成線上預約報名：\n訂單編號：${bookingNo}\n學員姓名：${name}\n聯絡電話：${phone}\n報名場次：\n・${itemsDetail}${cardData.enable_ordering ? `\n應付金額：NT$ ${totalAmount.toLocaleString()}` : ''}${last5 ? `\n匯款後五碼：${last5}` : ''}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(window.lastOrderMsg).catch(() => {});
            }

            document.getElementById('createdBookingNo').textContent = bookingNo;
            document.getElementById('checkoutFormFields').classList.add('hidden');
            document.getElementById('bookingSuccessView').classList.remove('hidden');
            selectedCart = [];
            updateFloatingCart();
            renderCourseCards();
            renderDailySlots();
            lucide.createIcons();
        }

        function openProOwnerLine() {
            const url = cardData.sales_modules?.lineUrl || (cardData.social_links || []).find(l => l.icon === 'message-circle')?.url || 'https://line.me';
            window.open(url, '_blank');
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        function openOrderLookup() {
            const m = document.getElementById('lookupModal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }

        async function searchMyOrders() {
            const phone = document.getElementById('lookupPhone').value.trim();
            if (!phone) return;
            const resBox = document.getElementById('lookupResults');
            if (!supabaseClient) {
                resBox.innerHTML = `<p class="text-xs text-stone-500">演示模式：串接 Supabase 後即可即時查詢與補填後五碼。</p>`;
                return;
            }
            const { data } = await supabaseClient.from('pro_bookings').select('*').eq('card_id', cardData.id).eq('customer_phone', phone).order('created_at', { ascending: false });
            if (!data?.length) {
                resBox.innerHTML = `<p class="text-xs text-stone-500">查無此手機號碼的報名紀錄。</p>`;
                return;
            }
            resBox.innerHTML = data.map(o => `
                <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 text-xs space-y-1.5">
                    <div class="flex justify-between font-bold">
                        <span>單號：${o.booking_no}</span>
                        <span>${o.payment_status === 'verified' ? '已確認收款' : o.payment_status === 'reported' ? '已回報待核對' : '待匯款'}</span>
                    </div>
                    <p class="text-stone-600">總計 ${o.total_sessions} 堂 ｜ NT$ ${o.total_amount}</p>
                    ${o.payment_status === 'unpaid' ? `
                        <div class="flex gap-1.5 pt-1">
                            <input type="text" id="rep_${o.id}" maxlength="5" placeholder="輸入後五碼" class="flex-1 px-2 py-1 rounded border text-xs">
                            <button onclick="reportLast5('${o.id}')" class="px-2.5 py-1 rounded theme-btn-primary text-[11px]">送出</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function reportLast5(orderId) {
            const val = document.getElementById(`rep_${orderId}`).value.trim();
            if (val.length !== 5) return alert('請輸入 5 碼數字');
            await supabaseClient.from('pro_bookings').update({ remittance_last5: val, payment_status: 'reported' }).eq('id', orderId);
            alert('後五碼已回報給老師，請靜候核對通知');
            searchMyOrders();
        }

        initApp();
    </script>
</body>
</html>
