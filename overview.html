<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全日排程席位防撞總覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF8F5', 100: '#F5ECE3', 200: '#EBE5DF', 300: '#D5C7BC',
              400: '#BCA38F', 500: '#8C7355', 600: '#7A6246', 700: '#68523A',
              800: '#5C4B3C', 900: '#3D3126',
            }
          }
        }
      }
    };
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* 時間軸每半小時高度固定 40px */
    .slot-cell {
      height: 40px;
      min-height: 40px;
    }
  </style>
</head>
<body class="bg-brand-50 text-brand-900 antialiased min-h-screen pb-24 selection:bg-brand-200">

  <!-- 頂部沙龍抬頭 -->
  <header class="bg-white/95 backdrop-blur-md border-b border-brand-200 sticky top-0 z-40 px-4 py-3 shadow-2xs">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-brand-100 text-[#8C7355] flex items-center justify-center font-bold text-xs shadow-2xs">
          <i class="fa-solid fa-table-cells"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-brand-900 flex items-center gap-1.5" id="disp-store-title">
            <span>全日排程席位防撞總覽</span>
          </h1>
          <p class="text-[10px] text-brand-400 font-mono" id="disp-store-subtitle">Sibyl Schedule Canvas</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="renderGanttCanvas()" class="p-2 text-brand-500 hover:bg-brand-50 rounded-xl transition" title="重新整理">
          <i class="fa-solid fa-rotate-right text-xs"></i>
        </button>
        <button type="button" onclick="openManagerPinPrompt()" class="px-3 py-1.5 bg-brand-100 hover:bg-brand-200 text-brand-800 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs">
          <i class="fa-solid fa-gear text-[#8C7355]"></i>
          <span>店長專區</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-3 sm:p-4 space-y-4">

    <!-- 1. 日期快速滑動切換列 -->
    <section class="bg-white p-3.5 rounded-3xl border border-brand-200 shadow-sm flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button type="button" onclick="shiftDay(-1)" class="w-8 h-8 rounded-xl border border-brand-200 hover:bg-brand-50 flex items-center justify-center text-xs font-bold transition">
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>
        <div class="flex items-center gap-1.5">
          <i class="fa-regular fa-calendar text-[#8C7355]"></i>
          <input type="date" id="current-date-picker" onchange="onDateChanged(this.value)" class="p-1 bg-transparent font-bold text-sm outline-none font-mono cursor-pointer">
        </div>
        <button type="button" onclick="shiftDay(1)" class="w-8 h-8 rounded-xl border border-brand-200 hover:bg-brand-50 flex items-center justify-center text-xs font-bold transition">
          <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
      </div>

      <!-- 圖例說明 -->
      <div class="hidden sm:flex items-center gap-3 text-[10.5px]">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-500"></span> Group A (可插單)</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-[#8C7355]"></span> Group B (全程專屬)</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 空性格子 (點擊秒插單)</span>
      </div>
    </section>

    <!-- 2. 全日排程甘特畫布 (核心畫布) -->
    <section class="bg-white rounded-3xl border border-brand-200 shadow-md overflow-hidden">
      <!-- 畫布滾動容器 -->
      <div class="overflow-x-auto no-scrollbar">
        <div class="min-w-[680px]">
          
          <!-- 表頭：專員列表 -->
          <div class="grid border-b border-brand-200 bg-brand-50/70" id="gantt-header-row">
            <!-- JS 動態生成專員欄位 -->
          </div>

          <!-- 表身：時間刻度與各專員欄位網格 -->
          <div class="relative" id="gantt-body-container">
            <!-- JS 動態生成網格與色塊 -->
          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- ========================================================================= -->
  <!-- 快速插單模態視窗 (點選空白格子立即開啟) -->
  <!-- ========================================================================= -->
  <div id="booking-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-4 text-xs">
      <div class="flex justify-between items-center pb-2 border-b border-brand-100">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold">
            <i class="fa-solid fa-calendar-plus text-xs"></i>
          </div>
          <div>
            <span class="font-bold text-sm text-brand-900" id="modal-slot-title">時段快速插單</span>
            <div class="text-[10px] text-brand-400 font-mono" id="modal-slot-meta">專員：未選 ｜ 時間：--:--</div>
          </div>
        </div>
        <button type="button" onclick="closeBookingModal()" class="w-7 h-7 rounded-full bg-brand-50 text-brand-400 hover:text-brand-900 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- 顧客搜尋與帶入 -->
      <div class="space-y-2">
        <label class="block font-bold text-brand-800">顧客手機號碼 * (輸入自動比對帶入)：</label>
        <div class="flex gap-2">
          <input type="tel" id="book-phone" maxlength="10" placeholder="0912345678" onblur="lookupCustomer(this.value)" class="flex-1 p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-mono font-bold outline-none focus:border-brand-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-brand-700 text-[10.5px] mb-1">顧客姓名 *：</label>
            <input type="text" id="book-name" placeholder="例: 林小美" class="w-full p-2 bg-brand-50/60 rounded-xl border border-brand-200 outline-none">
          </div>
          <div>
            <label class="block font-bold text-brand-700 text-[10.5px] mb-1">LINE 稱呼 (選填)：</label>
            <input type="text" id="book-line" placeholder="例: May" class="w-full p-2 bg-brand-50/60 rounded-xl border border-brand-200 outline-none">
          </div>
        </div>
        <div id="book-cust-hint" class="text-[10.5px] text-emerald-700 font-bold bg-emerald-50 p-2 rounded-xl border border-emerald-200 hidden"></div>
      </div>

      <!-- 服務項目挑選 -->
      <div class="space-y-1">
        <label class="block font-bold text-brand-800">挑選預約服務項目 *：</label>
        <select id="book-service-select" onchange="onServiceSelectionChange()" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-bold outline-none">
          <!-- JS 動態生成選項 -->
        </select>
        <div class="text-[10.5px] text-brand-500 flex justify-between pt-1" id="book-service-meta">
          <span>耗時：60 分鐘</span>
          <span class="font-mono font-bold text-brand-700">NT$ 1,200</span>
        </div>
      </div>

      <!-- 備註 -->
      <div>
        <label class="block font-bold text-brand-800 mb-1">現場備註 (選填)：</label>
        <input type="text" id="book-note" placeholder="例: 睫毛過敏、毛孩指甲敏感" class="w-full p-2 bg-brand-50/60 rounded-xl border border-brand-200 outline-none">
      </div>

      <div class="pt-2 flex gap-2">
        <button type="button" onclick="closeBookingModal()" class="w-1/3 py-2.5 bg-brand-100 text-brand-700 font-bold rounded-xl hover:bg-brand-200 transition">
          取消
        </button>
        <button type="button" onclick="confirmBookingInsert()" class="flex-1 py-2.5 bg-[#8C7355] hover:bg-[#7A6246] text-white font-bold rounded-xl transition shadow-md">
          確認排入行程
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- 店長專區：專員、服務項目、設備席位 ＆ 顧客小庫 (PIN 驗證後開啟) -->
  <!-- ========================================================================= -->
  <div id="manager-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full sm:max-w-2xl max-h-[92vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
      
      <!-- 抬頭 -->
      <div class="p-4 bg-brand-50 border-b border-brand-200 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-sliders"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-brand-900">店長後台配置中心 · 專員與防撞資源庫</div>
            <div class="text-[10px] text-brand-400">專員代號排序 · 服務項目管理 · 席位容量鎖定</div>
          </div>
        </div>
        <button type="button" onclick="closeManagerModal()" class="w-8 h-8 rounded-full bg-white border border-brand-200 text-brand-400 hover:text-brand-900 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- 分頁列 -->
      <div class="flex border-b border-brand-200 bg-white px-4 text-xs font-bold shrink-0">
        <button type="button" onclick="switchManagerTab('tab-staff', this)" class="mgr-tab-btn py-3 px-3.5 border-b-2 border-[#8C7355] text-[#8C7355]">
          專員名冊 (上下排序)
        </button>
        <button type="button" onclick="switchManagerTab('tab-services', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700">
          服務項目 (Group A/B)
        </button>
        <button type="button" onclick="switchManagerTab('tab-resources', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700">
          限制席位容量
        </button>
        <button type="button" onclick="switchManagerTab('tab-clients', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700">
          顧客小庫 (10筆分頁)
        </button>
      </div>

      <!-- 滾動區域 -->
      <div class="p-5 overflow-y-auto space-y-4 text-xs">

        <!-- [分頁 1] 專員名冊管理 -->
        <div id="tab-staff" class="mgr-pane space-y-3">
          <div class="flex justify-between items-center">
            <span class="font-bold text-brand-900">排程專員列表 (點擊上下箭頭調整排程顯示順序)：</span>
            <button type="button" onclick="openAddStaffModal()" class="px-2.5 py-1 bg-[#8C7355] text-white rounded-lg font-bold text-[11px] shadow-2xs">
              + 新增專員
            </button>
          </div>
          <div class="space-y-2" id="admin-staff-list"></div>
        </div>

        <!-- [分頁 2] 服務項目管理 -->
        <div id="tab-services" class="mgr-pane space-y-3 hidden">
          <div class="flex justify-between items-center">
            <span class="font-bold text-brand-900">服務項目主檔 (含插單屬性與設備關聯)：</span>
            <button type="button" onclick="openAddServiceModal()" class="px-2.5 py-1 bg-[#8C7355] text-white rounded-lg font-bold text-[11px] shadow-2xs">
              + 新增服務
            </button>
          </div>
          <div class="space-y-2 max-h-56 overflow-y-auto" id="admin-services-list"></div>
        </div>

        <!-- [分頁 3] 席位防撞容量管理 -->
        <div id="tab-resources" class="mgr-pane space-y-3 hidden">
          <div class="flex justify-between items-center">
            <span class="font-bold text-brand-900">店內硬體限制設備容量 (防撞核心)：</span>
            <button type="button" onclick="openAddResourceModal()" class="px-2.5 py-1 bg-[#8C7355] text-white rounded-lg font-bold text-[11px] shadow-2xs">
              + 新增設備
            </button>
          </div>
          <div class="space-y-2" id="admin-resources-list"></div>
        </div>

        <!-- [分頁 4] 顧客小資料庫 (10筆分頁 + 搜尋) -->
        <div id="tab-clients" class="mgr-pane space-y-3 hidden">
          <div class="flex gap-2">
            <input type="text" id="cust-search-input" oninput="filterCustomerList()" placeholder="輸入手機、顧客姓名或 LINE 暱稱搜尋..." class="flex-1 p-2.5 bg-brand-50 rounded-xl border border-brand-200 text-xs outline-none focus:border-brand-500">
            <button type="button" onclick="exportCustomersCsv()" class="px-3 py-2 bg-brand-100 text-brand-800 rounded-xl font-bold hover:bg-brand-200 transition">
              匯出名冊
            </button>
          </div>
          <div class="space-y-2.5" id="admin-customers-table"></div>
          <!-- 分頁器 -->
          <div class="flex justify-between items-center pt-2 border-t border-brand-100 text-[11px]">
            <span class="text-brand-500" id="cust-page-info">第 1 / 1 頁</span>
            <div class="flex gap-1" id="cust-page-btns"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tzqpfnrpnfzzubofoqlt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6cXBmbnJwbmZ6enVib2ZvcWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODQ5ODYsImV4cCI6MjEwODE2MDk4Nn0.B-ub7DCpzF3b2gjpTrM9jdW0SLOqRPillZTmoXPuNgk";

    let currentStore = {
      id: "default-store",
      store_name: "希貝兒沙龍排程總覽",
      admin_pin: "8888"
    };

    // 專員名冊 (代號制，支援上下排序)
    let staffList = [
      { id: "S01", name: "專員 A" },
      { id: "S02", name: "專員 B" },
      { id: "S03", name: "專員 C" }
    ];

    // 服務項目主檔 (含大分類、插單屬性、設備連動)
    let serviceCatalog = [
      { id: "srv-1", name: "美睫嫁接 120根", category: "現場主要服務", price: 1200, dur: 60, type: "Group_B", resource: "none" },
      { id: "srv-2", name: "深層頭皮 SPA 護理", category: "現場主要服務", price: 1500, dur: 90, type: "Group_A", resource: "沖水椅" },
      { id: "srv-3", name: "客製凝膠造型美甲", category: "現場主要服務", price: 1600, dur: 90, type: "Group_B", resource: "美甲工作桌" },
      { id: "srv-4", name: "毛孩草本精油深層泥浴", category: "加購服務", price: 800, dur: 45, type: "Group_A", resource: "SPA泥浴槽" }
    ];

    // 店內硬體設備席位容量 (防撞核心)
    let storeResources = [
      { id: "res-1", name: "沖水椅", capacity: 2 },
      { id: "res-2", name: "美甲工作桌", capacity: 2 },
      { id: "res-3", name: "SPA泥浴槽", capacity: 1 }
    ];

    // 當日預約行程記錄集
    let bookingsDb = [];
    // 顧客資料庫 (手機為 key)
    let customerDb = {};

    let selectedDate = getTodayDateStr();
    let pendingSlotInsert = null;

    // 顧客小庫分頁
    let custCurrentPage = 1;
    const CUST_PAGE_SIZE = 10;
    let filteredCustList = [];

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('current-date-picker').value = selectedDate;
      await loadStoreByUrlParams();
      loadLocalMockDataIfEmpty();
      renderGanttCanvas();
      populateServiceSelect();
    });

    // 1. 雙軌讀取店家設定 (?s= 或 ?store_id=)
    async function loadStoreByUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      const storeParam = urlParams.get('s') || urlParams.get('store') || urlParams.get('store_id');

      if (!storeParam) return;

      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(storeParam);
      const queryUrl = isUuid
        ? `${SUPABASE_URL}/rest/v1/tool_stores?id=eq.${storeParam}&select=*`
        : `${SUPABASE_URL}/rest/v1/tool_stores?store_slug=eq.${storeParam}&select=*`;

      try {
        const res = await fetch(queryUrl, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const stores = await res.json();
        if (stores && stores.length > 0) {
          currentStore = stores[0];
          document.getElementById('disp-store-title').innerHTML = `<span>${currentStore.store_name}</span>`;
          document.getElementById('disp-store-subtitle').innerText = `排程端點: ${currentStore.store_slug || currentStore.id.slice(0,8)}`;

          await loadCloudOverviewSettings(currentStore.id);
        }
      } catch (err) {
        console.warn("載入雲端設定異常:", err);
      }
    }

    async function loadCloudOverviewSettings(storeId) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tool_settings?store_id=eq.${storeId}&select=*`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        if (data && data.length > 0 && data[0].slot_config && data[0].slot_config.overview_config) {
          const cfg = data[0].slot_config.overview_config;
          if (cfg.staffList) staffList = cfg.staffList;
          if (cfg.serviceCatalog) serviceCatalog = cfg.serviceCatalog;
          if (cfg.storeResources) storeResources = cfg.storeResources;
        }
      } catch (e) {
        console.error("載入排程設定失敗:", e);
      }
    }

    function loadLocalMockDataIfEmpty() {
      const storedBookings = localStorage.getItem('overview_bookings_data');
      if (storedBookings) {
        bookingsDb = JSON.parse(storedBookings);
      } else {
        // 初始示範預約
        bookingsDb = [
          {
            id: "b-101",
            date: selectedDate,
            staffId: "S01",
            startTime: "10:30",
            durMins: 60,
            custName: "林小姐",
            custPhone: "0912345678",
            serviceName: "美睫嫁接 120根",
            type: "Group_B",
            resource: "none"
          },
          {
            id: "b-102",
            date: selectedDate,
            staffId: "S02",
            startTime: "14:00",
            durMins: 90,
            custName: "陳小姐",
            custPhone: "0988776655",
            serviceName: "深層頭皮 SPA 護理",
            type: "Group_A",
            resource: "沖水椅"
          }
        ];
        saveBookingsDb();
      }

      // 重建顧客小庫
      customerDb = JSON.parse(localStorage.getItem('overview_customers_db') || '{}');
      bookingsDb.forEach(b => {
        if (b.custPhone && !customerDb[b.custPhone]) {
          customerDb[b.custPhone] = { phone: b.custPhone, name: b.custName, line: '', visits: 1 };
        }
      });
      saveCustomerDb();
      updateFilteredCustList();
    }

    // 2. 甘特排程畫布核心渲染
    function renderGanttCanvas() {
      const headerRow = document.getElementById('gantt-header-row');
      const bodyContainer = document.getElementById('gantt-body-container');

      // 產生專員表頭網格 (第一欄固定為「時間刻度」)
      headerRow.style.gridTemplateColumns = `80px repeat(${staffList.length}, minmax(180px, 1fr))`;
      headerRow.innerHTML = `
        <div class="p-3 text-center font-bold text-brand-600 border-r border-brand-200">時間</div>
        ${staffList.map(s => `
          <div class="p-3 text-center font-bold text-brand-900 border-r border-brand-200 last:border-none flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>${s.name} (${s.id})</span>
          </div>
        `).join('')}
      `;

      // 營業時間 10:00 ~ 21:00 (共 22 個 30 分鐘時段)
      const timeSlots = [];
      for (let h = 10; h <= 20; h++) {
        timeSlots.push(`${String(h).padStart(2, '0')}:00`);
        timeSlots.push(`${String(h).padStart(2, '0')}:30`);
      }

      bodyContainer.style.gridTemplateColumns = `80px repeat(${staffList.length}, minmax(180px, 1fr))`;
      bodyContainer.className = "grid relative";

      // 繪製背景網格與空白點選插單格子
      let gridHtml = '';
      timeSlots.forEach((tStr, slotIdx) => {
        // 左側時間標籤
        gridHtml += `

    function renderBookingBlocks(timeSlots) {
      const container = document.getElementById('gantt-body-container');
      const todaysBookings = bookingsDb.filter(b => b.date === selectedDate);

      todaysBookings.forEach(b => {
        const staffIndex = staffList.findIndex(s => s.id === b.staffId);
        if (staffIndex === -1) return;

        // 計算頂部位置與高度 (每半小時 40px)
        const [sh, sm] = b.startTime.split(':').map(Number);
        const startTotalMins = sh * 60 + sm;
        const baseTotalMins = 10 * 60; // 10:00 開始
        const topPx = ((startTotalMins - baseTotalMins) / 30) * 40;
        const heightPx = (b.durMins / 30) * 40 - 2;

        // 計算左側欄位位置
        // 欄位寬度百分比 = (100% - 80px) / 專員數量
        const colPercent = 100 / (staffList.length + (80 / 200)); 

        const block = document.createElement('div');
        block.className = `absolute z-20 rounded-xl p-2 text-white shadow-md cursor-pointer transition hover:scale-[1.01] overflow-hidden flex flex-col justify-between ${
          b.type === 'Group_A' ? 'bg-amber-600 border border-amber-400' : 'bg-[#8C7355] border border-[#7A6246]'
        }`;

        // 使用 CSS Grid 欄位定位
        block.style.top = `${topPx}px`;
        block.style.height = `${heightPx}px`;
        block.style.gridColumnStart = `${staffIndex + 2}`;
        block.style.gridColumnEnd = `${staffIndex + 3}`;
        block.style.marginLeft = '4px';
        block.style.marginRight = '4px';

        const endMins = startTotalMins + b.durMins;
        const endTimeStr = `${String(Math.floor(endMins/60)).padStart(2,'0')}:${String(endMins%60).padStart(2,'0')}`;

        block.innerHTML = `
          <div>
            <div class="flex justify-between items-center text-[10px] font-mono opacity-90 pb-0.5 border-b border-white/20">
              <span>${b.startTime} - ${endTimeStr}</span>
              <span class="font-bold">${b.type === 'Group_A' ? 'Group A' : 'Group B'}</span>
            </div>
            <div class="font-bold text-xs truncate mt-1">${b.custName} <span class="font-normal font-mono text-[10px]">(${b.custPhone})</span></div>
            <div class="text-[10px] truncate opacity-95">${b.serviceName}</div>
          </div>
          ${b.resource && b.resource !== 'none' ? `<div class="text-[9px] bg-black/20 rounded px-1 py-0.5 inline-block truncate"><i class="fa-solid fa-chair text-[8px] mr-0.5"></i>設備: ${b.resource}</div>` : ''}
        `;

        block.onclick = (e) => {
          e.stopPropagation();
          viewBookingDetail(b.id);
        };

        container.appendChild(block);
      });
    }

    // 確認插單寫入（防撞檢測 ＋ 顧客建檔覆寫）
    function confirmBookingInsert() {
      const phone = document.getElementById('book-phone').value.trim();
      const name = document.getElementById('book-name').value.trim();
      const line = document.getElementById('book-line').value.trim();
      const sId = document.getElementById('book-service-select').value;

      if (!phone || !name || !s) {

      }

      // 檢查時段專員衝突 (防撞)
      const hasConflict = checkStaffConflict(pendingSlotInsert.staffId, selectedDate, pendingSlotInsert.timeStr, s.dur);
      if (hasConflict) {
        return Swal.fire('排程衝突！', `專員在該時段已有全程鎖定之預約，請選擇其他時段。`, 'error');
      }

      // 檢查硬體席位容量衝突
      if (s.resource && s.resource !== 'none') {
        const isResourceOver = checkResourceCapacity(s.resource, selectedDate, pendingSlotInsert.timeStr, s.dur);
        if (isResourceOver) {
          return Swal.fire('席位設備防撞警報！', `店內【${s.resource}】在該時段已達全店容量上限，無法同時使用！`, 'warning');
        }
      }

      // 建立預約物件
      const newBooking = {
        id: `b-${Date.now().toString().slice(-5)}`,
        date: selectedDate,
        staffId: pendingSlotInsert.staffId,
        startTime: pendingSlotInsert.timeStr,
        durMins: s.dur,
        custName: name,
        custPhone: phone,
        custLine: line,
        serviceName: s.name,
        price: s.price,
        type: s.type,
        resource: s.resource,
        note: document.getElementById('book-note').value.trim()
      };

      bookingsDb.push(newBooking);
      saveBookingsDb();

      // 覆寫更新顧客小庫
      if (!customerDb[phone]) {
        customerDb[phone] = { phone: phone, name: name, line: line, visits: 1 };
      } else {
        customerDb[phone].name = name;
        if (line) customerDb[phone].line = line;
        customerDb[phone].visits = (customerDb[phone].visits || 1) + 1;
      }
      saveCustomerDb();
      updateFilteredCustList();

      closeBookingModal();
      renderGanttCanvas();

      Swal.fire({
        title: '插單成功！',
        text: `已排入 ${pendingSlotInsert.staffName} ${pendingSlotInsert.timeStr} 行程中`,
        icon: 'success',
        timer: 1000,
        showConfirmButton: false
      });

    // 防撞碰撞檢查核心函式
    function checkStaffConflict(staffId, date, startTime, durMins) {
      const [sh, sm] = startTime.split(':').map(Number);
      const newStart = sh * 60 + sm;
      const newEnd = newStart + durMins;

      const sameStaffBookings = bookingsDb.filter(b => b.date === date && b.staffId === staffId);
      for (let b of sameStaffBookings) {
        const [bh, bm] = b.startTime.split(':').map(Number);
        const bStart = bh * 60 + bm;
        const bEnd = bStart + b.durMins;

        // 時間重疊
        if (newStart < bEnd && newEnd > bStart) {
          // 若兩者其一是 Group B 全程專屬，則嚴格禁止重疊
          if (b.type === 'Group_B') return true;
        }
      }
      return false;
    }

    function checkResourceCapacity(resourceName, date, startTime, durMins) {
      const resObj = storeResources.find(r => r.name === resourceName);
      if (!resObj) return false;

      const [sh, sm] = startTime.split(':').map(Number);
      const newStart = sh * 60 + sm;
      const newEnd = newStart + durMins;

      // 統計同一時段使用該設備的預約數量
      const activeResCount = bookingsDb.filter(b => {
        if (b.date !== date || b.resource !== resourceName) return false;
        const [bh, bm] = b.startTime.split(':').map(Number);
        const bStart = bh * 60 + bm;
        const bEnd = bStart + b.durMins;
        return (newStart < bEnd && newEnd > bStart);
      }).length;

      return activeResCount >= resObj.capacity;
    }

      } else {
        filteredCustList = Object.values(customerDb).filter(c => 
          (c.phone && c.phone.includes(q)) ||
          (c.name && c.name.toLowerCase().includes(q)) ||
          (c.line && c.line.toLowerCase().includes(q))
        );
      }
      custCurrentPage = 1;
      renderCustomerTable();
    }

    function renderCustomerTable() {
      const container = document.getElementById('admin-customers-table');
      const pageInfo = document.getElementById('cust-page-info');
      const btns = document.getElementById('cust-page-btns');

      if (filteredCustList.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-brand-400">目前尚無符合的顧客資料</div>';
        pageInfo.innerText = '共 0 位顧客';
        btns.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(filteredCustList.length / CUST_PAGE_SIZE) || 1;
      if (custCurrentPage > totalPages) custCurrentPage = totalPages;

      const start = (custCurrentPage - 1) * CUST_PAGE_SIZE;
      const end = Math.min(start + CUST_PAGE_SIZE, filteredCustList.length);
      const paged = filteredCustList.slice(start, end);

      pageInfo.innerText = `顯示第 ${start + 1} - ${end} 位（共 ${filteredCustList.length} 位顧客）`;

      container.innerHTML = paged.map(c => `
        <div class="p-3 bg-white rounded-2xl border border-brand-200 flex justify-between items-center text-xs shadow-2xs">
          <div>
            <div class="font-bold text-brand-900">${c.name} <span class="font-mono text-gray-400 font-normal ml-1">(${c.phone})</span></div>
            <div class="text-[10px] text-brand-500 mt-0.5">LINE: ${c.line || '未填'} ｜ 累計排程預約：<b>${c.visits || 1}</b> 次</div>
          </div>
          <button type="button" onclick="selectCustToBook('${c.phone}')" class="px-3 py-1.5 bg-[#8C7355] text-white rounded-xl text-xs font-bold hover:bg-[#7A6246] transition">
            帶入預約
          </button>
        </div>
      `).join('');

      btns.innerHTML = `
        <button type="button" onclick="changeCustPage(${custCurrentPage - 1})" ${custCurrentPage === 1 ? 'disabled class="opacity-30"' : ''} class="px-2 py-1 bg-white border rounded text-[11px] font-bold">上一頁</button>
        <span class="px-2 py-1 font-mono font-bold text-brand-700">${custCurrentPage} / ${totalPages}</span>
        <button type="button" onclick="changeCustPage(${custCurrentPage + 1})" ${custCurrentPage === totalPages ? 'disabled class="opacity-30"' : ''} class="px-2 py-1 bg-white border rounded text-[11px] font-bold">下一頁</button>
      `;
    }

    function changeCustPage(p) {
      custCurrentPage = p;
      renderCustomerTable();
    }

    function selectCustToBook(phone) {
      if (customerDb[phone]) {
        closeManagerModal();
        // 預設指定第一位專員 11:00 插單
        onEmptySlotClicked(staffList[0].id, staffList[0].name, '11:00');
        document.getElementById('book-phone').value = phone;
        lookupCustomer(phone);
      }
    }

    function exportCustomersCsv() {
      const list = Object.values(customerDb);
      if (list.length === 0) return Swal.fire('尚無顧客名冊可匯出', '', 'info');
      let csv = "data:text/csv;charset=utf-8,\uFEFF";
      csv += "顧客姓名,手機號碼,LINE稱呼,累計排程次數\n";
      list.forEach(c => {
        csv += `"${c.name}","${c.phone}","${c.line || ''}",${c.visits || 1}\n`;
      });
      const a = document.createElement("a");
      a.href = encodeURI(csv);
      a.download = `${currentStore.store_name}_排程顧客名冊.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // 10. 雲端同步與本地儲存
    async function saveOverviewConfigToCloud() {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/tool_settings`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
          },
          body: JSON.stringify({
            store_id: currentStore.id,
            slot_config: {
              overview_config: { staffList, serviceCatalog, storeResources }
            },
            updated_at: new Date().toISOString()
          })
        });
      } catch (e) {
        console.warn("雲端同步異常:", e);
      }
    }

    function saveBookingsDb() {
      localStorage.setItem('overview_bookings_data', JSON.stringify(bookingsDb));
    }

    function saveCustomerDb() {
      localStorage.setItem('overview_customers_db', JSON.stringify(customerDb));
    }

    function getTodayDateStr() {
      return formatYearMonthDay(new Date());
    }

    function formatYearMonthDay(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
