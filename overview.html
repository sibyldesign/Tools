<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全日排程席位防撞總覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF8F5', 100: '#F5ECE3', 200: '#EBE5DF', 300: '#D5C7BC',
              400: '#BCA38F', 500: '#8C7355', 600: '#7A6246', 700: '#68523A',
              800: '#5C4B3C', 900: '#3D3126',
            }
          }
        }
      }
    };
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* SweetAlert2 全域確認按鈕統一套用系統質感棕色 */
    .swal2-styled.swal2-confirm {
      background-color: #8C7355 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 6px rgba(140, 115, 85, 0.35) !important;
      border: none !important;
      border-radius: 0.875rem !important;
      font-weight: 700 !important;
      padding: 0.625rem 1.5rem !important;
      font-size: 0.8125rem !important;
    }

    .swal2-styled.swal2-confirm:hover {
      background-color: #7A6246 !important;
    }

    .swal2-styled.swal2-confirm:focus {
      box-shadow: 0 0 0 3px rgba(140, 115, 85, 0.3) !important;
    }

    /* 取消按鈕同步美化為質感米灰 */
    .swal2-styled.swal2-cancel {
      background-color: #EBE5DF !important;
      color: #5C4B3C !important;
      border-radius: 0.875rem !important;
      font-weight: 700 !important;
      padding: 0.625rem 1.25rem !important;
      font-size: 0.8125rem !important;
    }

    .swal2-styled.swal2-cancel:hover {
      background-color: #D5C7BC !important;
    }
  </style>
</head>
<body class="bg-brand-50 text-brand-900 antialiased min-h-screen pb-24 selection:bg-brand-200 select-none">

  <!-- 頂部抬頭 -->
  <header class="bg-white/95 backdrop-blur-md border-b border-brand-200 sticky top-0 z-40 px-4 py-3 shadow-2xs">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-brand-100 text-[#8C7355] flex items-center justify-center font-bold text-xs shadow-2xs">
          <i class="fa-solid fa-table-cells"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-brand-900 flex items-center gap-1.5" id="disp-store-title">
            <span>全日排程席位防撞總覽</span>
          </h1>
          <p class="text-[10px] text-brand-400 font-mono" id="disp-store-subtitle">Sibyl Schedule Canvas</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="renderGanttCanvas()" class="p-2 text-brand-500 hover:bg-brand-50 rounded-xl transition" title="重新整理">
          <i class="fa-solid fa-rotate-right text-xs"></i>
        </button>
        <button type="button" onclick="openManagerPinPrompt()" class="px-3 py-1.5 bg-[#8C7355] hover:bg-[#7A6246] text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs">
          <i class="fa-solid fa-gear text-amber-200"></i>
          <span>店長專區</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-3 sm:p-4 space-y-4">

    <!-- 1. 頂部日期橫向滑動膠囊與專員篩選 -->
    <section class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <!-- 14天滑動膠囊 -->
      <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="date-capsules-bar"></div>

      <!-- 專員過濾膠囊 -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-brand-100 text-xs">
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="staff-filter-bar"></div>
        <div class="hidden lg:flex items-center gap-3 text-[10.5px]">
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-500"></span> Group A (可插單)</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-[#8C7355]"></span> Group B (全程專屬)</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-stone-300"></span> 專員休假</span>
        </div>
      </div>
    </section>

    <!-- 2. 全日排程甘特畫布 (核心畫布) -->
    <section class="bg-white rounded-3xl border border-brand-200 shadow-md overflow-hidden">
      <div class="overflow-x-auto no-scrollbar">
        <div class="min-w-[680px]">
          <!-- 表頭：專員列表 -->
          <div class="grid border-b border-brand-200 bg-brand-50/70" id="gantt-header-row"></div>
          <!-- 表身：時間刻度與各專員欄位網格 -->
          <div class="relative bg-white" id="gantt-body-container"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- 快速插單模態視窗 -->
  <div id="booking-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-4 text-xs">
      
      <div class="flex justify-between items-center pb-2 border-b border-brand-100">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold">
            <i class="fa-solid fa-calendar-plus text-xs"></i>
          </div>
          <div>
            <span class="font-bold text-sm text-brand-900" id="modal-slot-title">時段快速排程</span>
            <div class="text-[10px] text-brand-400 font-mono" id="modal-slot-meta">專員：未選</div>
          </div>
        </div>
        <button type="button" onclick="closeBookingModal()" class="w-7 h-7 rounded-full bg-brand-50 text-brand-400 hover:text-brand-900 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- 模式切換 -->
      <div class="flex p-1 bg-brand-100/60 rounded-xl gap-1 font-bold">
        <button type="button" id="btn-mode-booking" onclick="switchBookingMode('booking')" class="flex-1 py-1.5 rounded-lg bg-white shadow-2xs text-[#8C7355]">
          <i class="fa-solid fa-user-plus mr-1"></i>顧客預約排程
        </button>
        <button type="button" id="btn-mode-off" onclick="switchBookingMode('off')" class="flex-1 py-1.5 rounded-lg text-brand-400">
          <i class="fa-solid fa-mug-hot mr-1"></i>專員登記休假
        </button>
      </div>

      <!-- 時間微調 -->
      <div class="p-2.5 bg-brand-50 rounded-xl border border-brand-200 space-y-2">
        <div class="flex items-center justify-between">
          <label class="font-bold text-brand-800 text-[11px] flex items-center gap-1">
            <i class="fa-regular fa-clock text-[#8C7355]"></i> 開始時間：
          </label>
          <div class="flex items-center gap-1 text-[10px]">
            <span class="text-brand-400">間隔:</span>
            <button type="button" onclick="setSlotStep(15)" id="btn-step-15" class="px-1.5 py-0.5 rounded border border-brand-200 bg-white font-mono font-bold">15分</button>
            <button type="button" onclick="setSlotStep(30)" id="btn-step-30" class="px-1.5 py-0.5 rounded border border-[#8C7355] bg-[#8C7355] text-white font-mono font-bold">30分</button>
            <button type="button" onclick="setSlotStep(60)" id="btn-step-60" class="px-1.5 py-0.5 rounded border border-brand-200 bg-white font-mono font-bold">60分</button>
          </div>
        </div>
        <select id="book-start-time" class="w-full p-2 bg-white border border-brand-200 rounded-lg font-mono font-bold text-xs outline-none text-center"></select>
      </div>

      <!-- 顧客預約表單 -->
      <div id="box-booking-mode" class="space-y-3">
        <div class="space-y-2">
          <label class="block font-bold text-brand-800">顧客手機號碼 * (輸入自動帶入)：</label>
          <input type="tel" id="book-phone" onblur="lookupCustomerAny()" maxlength="10" placeholder="0912345678" onblur="lookupCustomer(this.value)" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-mono font-bold outline-none focus:border-brand-500">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-brand-700 text-[10.5px] mb-1">顧客姓名 *：</label>
              <input type="text" id="book-name" onblur="lookupCustomerAny()" placeholder="例: 林小美" class="w-full p-2 bg-brand-50/60 rounded-xl border border-brand-200 outline-none">
            </div>
            <div>
              <label class="block font-bold text-brand-700 text-[10.5px] mb-1">LINE 稱呼 (選填)：</label>
              <input type="text" id="book-line" onblur="lookupCustomerAny()" placeholder="例: May" class="w-full p-2 bg-brand-50/60 rounded-xl border border-brand-200 outline-none">
            </div>
          </div>
          <div id="book-cust-hint" class="text-[10.5px] text-emerald-700 font-bold bg-emerald-50 p-2 rounded-xl border border-emerald-200 hidden"></div>
        </div>

        <div class="space-y-1">
          <label class="block font-bold text-brand-800">挑選預約服務項目 *：</label>
          <select id="book-service-select" onchange="onServiceSelectionChange()" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-bold outline-none"></select>
          <div class="text-[10.5px] text-brand-500 flex justify-between pt-1" id="book-service-meta">
            <span>耗時：60 分鐘</span>
            <span class="font-mono font-bold text-brand-700">NT$ 1,200</span>
          </div>
        </div>

        <div>
          <label class="block font-bold text-brand-800 mb-1">現場備註 (選填)：</label>
          <input type="text" id="book-note" placeholder="例: 睫毛過敏、毛孩指甲敏感" class="w-full p-2 bg-brand-50/60 rounded-xl border border-brand-200 outline-none">
        </div>
      </div>

      <!-- 專員休假表單 -->
      <div id="box-off-mode" class="space-y-3 hidden">
        <div>
          <label class="block font-bold text-brand-700 text-[10.5px] mb-1">休假長度：</label>
          <select id="off-duration-select" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-bold outline-none">
            <option value="30">休息 30 分鐘</option>
            <option value="60" selected>休息 1 小時</option>
            <option value="90">休息 1.5 小時</option>
            <option value="120">休息 2 小時</option>
            <option value="240">半日休假 (4 小時)</option>
            <option value="480">全日公休 (8 小時)</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-brand-700 text-[10.5px] mb-1">休假事由 (外出、用餐、特休、訓練)：</label>
          <input type="text" id="off-reason" value="專員休假" class="w-full p-2.5 bg-brand-50/60 rounded-xl border border-brand-200 font-bold outline-none">
        </div>
      </div>

      <!-- 按鈕列 -->
      <div class="pt-2 flex gap-2">
        <button type="button" onclick="closeBookingModal()" class="w-1/3 py-2.5 bg-brand-100 text-brand-700 font-bold rounded-xl hover:bg-brand-200 transition">
          取消
        </button>
        <button type="button" onclick="confirmBookingInsert()" class="flex-1 py-2.5 bg-[#8C7355] hover:bg-[#7A6246] text-white font-bold rounded-xl transition shadow-md">
          確認排入行程
        </button>
      </div>
    </div>
  </div>

  <!-- 店長專區模態視窗 -->
  <div id="manager-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full sm:max-w-2xl max-h-[92vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
      
      <!-- 抬頭 -->
      <div class="p-4 bg-brand-50 border-b border-brand-200 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-sliders"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-brand-900">店長排程後台 · 專員與服務防撞管理</div>
            <div class="text-[10px] text-brand-400">專員代號排序 · 服務項目管理 · 席位容量鎖定</div>
          </div>
        </div>
        <button type="button" onclick="closeManagerModal()" class="w-8 h-8 rounded-full bg-white border border-brand-200 text-brand-400 hover:text-brand-900 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- 分頁標籤 -->
      <div class="flex border-b border-brand-200 bg-white px-4 text-xs font-bold shrink-0 overflow-x-auto no-scrollbar">
        <button type="button" onclick="switchManagerTab('tab-business-settings', this)" class="mgr-tab-btn py-3 px-3.5 border-b-2 border-[#8C7355] text-[#8C7355] shrink-0">
          營業時段與公休
        </button>
        <button type="button" onclick="switchManagerTab('tab-staff', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700 shrink-0">
          專員名冊
        </button>
        <button type="button" onclick="switchManagerTab('tab-services', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700 shrink-0">
          服務項目
        </button>
        <button type="button" onclick="switchManagerTab('tab-resources', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700 shrink-0">
          席位設備容量
        </button>
        <button type="button" onclick="switchManagerTab('tab-clients', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700 shrink-0">
          顧客庫
        </button>
        <button type="button" onclick="switchManagerTab('tab-audit-logs', this)" class="mgr-tab-btn py-3 px-3.5 text-brand-400 hover:text-brand-700 shrink-0">
  插單審計紀錄
</button>
      </div>

      <!-- 滾動內容區域 -->
      <div class="p-5 overflow-y-auto space-y-4 text-xs">

        <!-- 營業時間與公休日配置 -->
        <div id="tab-business-settings" class="mgr-pane space-y-4">
          <div class="p-3.5 bg-brand-50 rounded-2xl border border-brand-200 space-y-3">
            <span class="font-bold text-brand-900 block border-b border-brand-200 pb-1.5">
              <i class="fa-solid fa-clock text-[#8C7355] mr-1"></i> 營業時間與前台框格間隔
            </span>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <div>
                <label class="block font-bold text-brand-700 text-[10.5px] mb-1">開始營業時間：</label>
                <input type="time" id="cfg-open-start" value="09:00" class="w-full p-2 bg-white rounded-xl border border-brand-200 text-xs font-mono font-bold outline-none">
              </div>
              <div>
                <label class="block font-bold text-brand-700 text-[10.5px] mb-1">結束營業時間：</label>
                <input type="time" id="cfg-open-end" value="21:00" class="w-full p-2 bg-white rounded-xl border border-brand-200 text-xs font-mono font-bold outline-none">
              </div>
              <div>
                <label class="block font-bold text-brand-700 text-[10.5px] mb-1">時間框格間隔：</label>
                <select id="cfg-slot-interval" class="w-full p-2 bg-white rounded-xl border border-brand-200 text-xs font-bold outline-none">
                  <option value="15">每 15 分鐘 (極細緻)</option>
                  <option value="30" selected>每 30 分鐘 (標準)</option>
                  <option value="60">每 60 分鐘 (一小時整點)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 每週固定公休 -->
          <div class="p-3.5 bg-brand-50 rounded-2xl border border-brand-200 space-y-2">
            <span class="font-bold text-brand-900 block border-b border-brand-200 pb-1.5">
              <i class="fa-solid fa-calendar-xmark text-[#8C7355] mr-1"></i> 每週固定公休日 (勾選後前台自動標註公休)
            </span>
            <div class="grid grid-cols-7 gap-1.5 text-center font-bold">
              <label class="flex flex-col items-center bg-white p-2 rounded-xl border border-brand-200 text-[11px] cursor-pointer"><input type="checkbox" value="0" class="cfg-weekly-cb accent-[#8C7355] mb-1">週日</label>
              <label class="flex flex-col items-center bg-white p-2 rounded-xl border border-brand-200 text-[11px] cursor-pointer"><input type="checkbox" value="1" class="cfg-weekly-cb accent-[#8C7355] mb-1">週一</label>
              <label class="flex flex-col items-center bg-white p-2 rounded-xl border border-brand-200 text-[11px] cursor-pointer"><input type="checkbox" value="2" class="cfg-weekly-cb accent-[#8C7355] mb-1">週二</label>
              <label class="flex flex-col items-center bg-white p-2 rounded-xl border border-brand-200 text-[11px] cursor-pointer"><input type="checkbox" value="3" class="cfg-weekly-cb accent-[#8C7355] mb-1">週三</label>
              <label class="flex flex-col items-center bg-white p-2 rounded-xl border border-brand-200 text-[11px] cursor-pointer"><input type="checkbox" value="4" class="cfg-weekly-cb accent-[#8C7355] mb-1">週四</label>
              <label class="flex flex-col items-center bg-white p-2 rounded-xl border border-brand-200 text-[11px] cursor-pointer"><input type="checkbox" value="5" class="cfg-weekly-cb accent-[#8C7355] mb-1">週五</label>
              <label class="flex flex-col items-center bg-white p-2 rounded-xl border border-brand-200 text-[11px] cursor-pointer"><input type="checkbox" value="6" class="cfg-weekly-cb accent-[#8C7355] mb-1">週六</label>
            </div>
          </div>

          <!-- 指定日期公休日 -->
          <div class="p-3.5 bg-brand-50 rounded-2xl border border-brand-200 space-y-2">
            <span class="font-bold text-brand-900 block border-b border-brand-200 pb-1.5">
              <i class="fa-solid fa-mug-hot text-[#8C7355] mr-1"></i> 指定日期店休 (特殊單日排休)
            </span>
            <div class="flex gap-2">
              <input type="date" id="cfg-custom-off-date" class="flex-1 p-2 bg-white rounded-xl border border-brand-200 font-mono text-xs">
              <button type="button" onclick="addSpecificOffDate()" class="px-3 py-2 bg-[#8C7355] text-white rounded-xl font-bold shadow-2xs shrink-0">
                + 新增公休日
              </button>
            </div>
            <div class="flex flex-wrap gap-1.5 pt-1" id="cfg-off-dates-chips"></div>
          </div>

          <button type="button" onclick="saveBusinessSettings()" class="w-full py-3 bg-stone-900 hover:bg-black text-white font-bold rounded-xl text-xs transition shadow-md">
            儲存營業時間與公休設定並更新
          </button>
        </div>

        <!-- 專員名冊 -->
        <div id="tab-staff" class="mgr-pane space-y-3 hidden">
          <div class="flex justify-between items-center">
            <span class="font-bold text-brand-900">專員名冊 ：</span>
            <button type="button" onclick="openAddStaffModal()" class="px-2.5 py-1.5 bg-[#8C7355] text-white rounded-lg font-bold text-[11px] shadow-2xs">
              + 新增專員
            </button>
          </div>
          <div class="space-y-2" id="admin-staff-list"></div>
        </div>

        <!-- 服務項目 -->
        <div id="tab-services" class="mgr-pane space-y-3 hidden">
          <div class="flex justify-between items-center">
            <span class="font-bold text-brand-900">服務主檔 (含大分類、Group A/B、設備連動)：</span>
            <button type="button" onclick="openAddServiceModal()" class="px-2.5 py-1.5 bg-[#8C7355] text-white rounded-lg font-bold text-[11px] shadow-2xs">
              + 新增服務
            </button>
          </div>
          <div class="space-y-2 max-h-60 overflow-y-auto" id="admin-services-list"></div>
        </div>

        <!-- 席位設備容量 -->
        <div id="tab-resources" class="mgr-pane space-y-3 hidden">
          <div class="flex justify-between items-center">
            <span class="font-bold text-brand-900">店內硬體限制設備容量 (防撞核心)：</span>
            <button type="button" onclick="openAddResourceModal()" class="px-2.5 py-1.5 bg-[#8C7355] text-white rounded-lg font-bold text-[11px] shadow-2xs">
              + 新增設備
            </button>
          </div>
          <div class="space-y-2" id="admin-resources-list"></div>
        </div>

        <!-- 顧客小資料庫 -->
        <div id="tab-clients" class="mgr-pane space-y-3 hidden">
          <div class="flex gap-2">
            <input type="text" id="cust-search-input" oninput="filterCustomerList()" placeholder="輸入手機、顧客姓名或 LINE 暱稱搜尋..." class="flex-1 p-2.5 bg-brand-50 rounded-xl border border-brand-200 text-xs outline-none focus:border-brand-500">
            <button type="button" onclick="exportCustomersCsv()" class="px-3 py-2 bg-brand-100 text-brand-800 rounded-xl font-bold hover:bg-brand-200 transition">
              匯出名冊
            </button>
          </div>
          <div class="space-y-2.5" id="admin-customers-table"></div>
          <div class="flex justify-between items-center pt-2 border-t border-brand-100 text-[11px]">
            <span class="text-brand-500" id="cust-page-info">第 1 / 1 頁</span>
            <div class="flex gap-1" id="cust-page-btns"></div>

          if (cfg.staffList) staffList = cfg.staffList;
          if (cfg.serviceCatalog) serviceCatalog = cfg.serviceCatalog;
          if (cfg.storeResources) storeResources = cfg.storeResources;
          if (cfg.scheduleConfig) {
            scheduleConfig = Object.assign(scheduleConfig, cfg.scheduleConfig);
            scheduleConfig.interval = Number(scheduleConfig.interval) || 30;
          }
        }
      } catch (e) {
        console.error("載入排程設定失敗:", e);

    // 2. 頂部 14 天日期膠囊
    function initDateCapsulesBar() {
      const container = document.getElementById('date-capsules-bar');
      if (!container) return;
      container.innerHTML = '';

      const weekNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

      for (let i = 0; i < 14; i++) {
        const d = new Date(today.getTime() + i * 86400000);
        const dateStr = formatYearMonthDay(d);
        const dayOfWeek = d.getDay();
        const isSelected = (dateStr === selectedDate);

        const isWeeklyOff = (scheduleConfig.weeklyOff || []).includes(dayOfWeek);
        const isSpecificOff = (scheduleConfig.specificOffDates || []).includes(dateStr);
        const isOffDay = isWeeklyOff || isSpecificOff;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `flex flex-col items-center justify-center min-w-[58px] py-2 px-1.5 rounded-2xl border transition shrink-0 ${
          isSelected 
            ? 'bg-[#8C7355] text-white border-[#8C7355] shadow-sm font-bold' 
            : isOffDay
              ? 'bg-stone-100 text-stone-400 border-stone-200'
              : 'bg-white hover:bg-brand-50 text-brand-800 border-brand-200'
        }`;
        btn.innerHTML = `
          <span class="text-[10px] opacity-80">${weekNames[dayOfWeek]}${isOffDay ? ' [休]' : ''}</span>
          <span class="text-sm font-black font-mono mt-0.5">${String(d.getDate()).padStart(2, '0')}日</span>

    // 3. 核心甘特畫布
    function getSlotHeightPx() {
      const intv = Number(scheduleConfig.interval) || 30;
      if (intv === 15) return 32;
      if (intv === 60) return 56;
      return 40;
    }

    function renderGanttCanvas() {
      const headerRow = document.getElementById('gantt-header-row');
      const bodyContainer = document.getElementById('gantt-body-container');

      const displayedStaff = (activeFilterStaffId === 'ALL')
        ? staffList
        : staffList.filter(s => s.id === activeFilterStaffId);

      headerRow.style.gridTemplateColumns = `repeat(${displayedStaff.length}, minmax(180px, 1fr))`;
      headerRow.innerHTML = displayedStaff.map(s => `
        <div class="py-3 px-2 text-center font-black text-brand-900 border-r border-brand-200 last:border-none text-sm">
          ${s.name}
        </div>
      `).join('');

      const [startH, startM] = (scheduleConfig.startTime || "09:00").split(':').map(Number);
      const [endH, endM] = (scheduleConfig.endTime || "21:00").split(':').map(Number);
      const totalStartMins = startH * 60 + (startM || 0);
      const totalEndMins = endH * 60 + (endM || 0);
      const interval = Number(scheduleConfig.interval) || 30;
      const slotHeight = getSlotHeightPx();

      const safeEndMins = (totalEndMins > totalStartMins) ? totalEndMins : (totalStartMins + 720);

      const timeSlots = [];
      for (let m = totalStartMins; m < safeEndMins; m += interval) {
        const hh = String(Math.floor(m / 60)).padStart(2, '0');
        const mm = String(m % 60).padStart(2, '0');
        timeSlots.push({ timeStr: `${hh}:${mm}`, totalMins: m, isHourMark: (m % 60 === 0) });
      }

      bodyContainer.style.gridTemplateColumns = `repeat(${displayedStaff.length}, minmax(180px, 1fr))`;
      bodyContainer.className = "grid relative bg-white";

      const curDayOfWeek = new Date(selectedDate).getDay();
      const isOffDay = (scheduleConfig.weeklyOff || []).includes(curDayOfWeek) || (scheduleConfig.specificOffDates || []).includes(selectedDate);

      let cellsHtml = '';
      if (isOffDay) {
        cellsHtml += `
          <div class="col-span-full bg-amber-50/80 border-b border-amber-200 text-amber-900 p-2 text-center text-xs font-bold flex items-center justify-center gap-1.5 z-30">
            <i class="fa-solid fa-mug-hot text-amber-700"></i> 本日（${selectedDate}）為門市公休日，非營業時段仍可點選插單
          </div>
        `;
      }

      timeSlots.forEach(slot => {
        displayedStaff.forEach((s) => {
          cellsHtml += `
            <div onclick="onEmptySlotClicked('${s.id}', '${s.name}', '${slot.timeStr}')"
              style="height: ${slotHeight}px;"
              class="relative border-b ${slot.isHourMark ? 'border-brand-200' : 'border-dashed border-brand-100'} border-r border-brand-200 last:border-r-0 hover:bg-emerald-50/40 cursor-pointer transition flex items-center justify-center group">
              <span class="text-[10px] font-mono ${slot.isHourMark ? 'text-gray-400 font-bold' : 'text-gray-300'} select-none tracking-wider group-hover:hidden">
                ${slot.isHourMark ? slot.timeStr : `:${slot.timeStr.split(':')[1]}`}
              </span>
              <span class="hidden group-hover:block text-[9.5px] text-emerald-700 font-bold">+ 插單</span>
            </div>
          `;
        });
      });

      bodyContainer.innerHTML = cellsHtml;
      renderBookingBlocks(displayedStaff, totalStartMins, interval, slotHeight);
    }

    // 動態配對項目色票（確保不同項目依序領取不同顏色）
    const serviceColorCache = {};
    let colorAssignCounter = 0;

    function getMorandiColorByService(serviceName) {
      if (!serviceName) return STRICT_MORANDI_PALETTE[0];
      if (!serviceColorCache[serviceName]) {
        serviceColorCache[serviceName] = STRICT_MORANDI_PALETTE[colorAssignCounter % STRICT_MORANDI_PALETTE.length];
        colorAssignCounter++;
      }
      return serviceColorCache[serviceName];
    }

    function renderBookingBlocks(displayedStaff, baseMins, interval, slotHeight) {
      const container = document.getElementById('gantt-body-container');
      const todays = bookingsDb.filter(b => b.date === selectedDate);
      const pxPerMinute = slotHeight / interval;

      displayedStaff.forEach((staff, staffIndex) => {
        const staffBookings = todays.filter(b => b.staffId === staff.id);

        staffBookings.forEach((b, i) => {
          const [sh, sm] = b.startTime.split(':').map(Number);
          const bStart = sh * 60 + sm;
          const bEnd = bStart + b.durMins;
          const topPx = (bStart - baseMins) * pxPerMinute;
          const heightPx = b.durMins * pxPerMinute - 2;
          if (topPx < 0) return;

          // 碰撞分流檢查：同專員、重疊時段、且可插單 (Group_A)
          let colPos = 0; // 0: 單獨滿版, 1: 靠左(寬度50%), 2: 靠右(寬度50%)
          // [優化] 重疊排程自動分流為左/右並排
          const hasOverlap = staffBookings.some((ob, oi) => {
            if (i === oi) return false;
            const [osh, osm] = ob.startTime.split(':').map(Number);
            const obStart = osh * 60 + osm;
            const obEnd = obStart + ob.durMins;
            return (bStart < obEnd && bEnd > obStart);
          });

          if (hasOverlap) {
            // 奇偶數分流左右兩側
            const isRightSide = (i % 2 === 1);
            block.style.width = 'calc(50% - 5px)';
            block.style.left = isRightSide ? 'calc(50% + 2px)' : '3px';
          } else {
            block.style.left = '3px';
            block.style.right = '3px';
          }

          if (hasOverlap && b.type === 'Group_A') {
            // 依據索引奇偶數分配左右側
            colPos = (i % 2 === 0) ? 1 : 2;
          }

          const isOff = (b.isOff === true);
          const block = document.createElement('div');
          const itemColor = getMorandiColorByService(b.serviceName);

          block.className = `absolute z-20 rounded-xl p-1.5 shadow-md cursor-pointer transition hover:scale-[1.01] overflow-hidden flex flex-col justify-between ${
            isOff ? 'bg-stone-200 border border-stone-300 text-stone-700' : 'text-white'
          }`;

          block.style.top = `${topPx}px`;
          block.style.height = `${heightPx}px`;
          block.style.gridColumnStart = `${staffIndex + 1}`;
          block.style.gridColumnEnd = `${staffIndex + 2}`;

          // 並排定位處理
          if (colPos === 1) {
            block.style.width = 'calc(50% - 6px)';
            block.style.left = '4px';
          } else if (colPos === 2) {
            block.style.width = 'calc(50% - 6px)';
            block.style.left = 'calc(50% + 2px)';
          } else {
            block.style.left = '4px';
            block.style.right = '4px';
          }

          if (!isOff) {
            block.style.backgroundColor = itemColor.bg;
            block.style.border = `1px solid ${itemColor.border}`;
          }

          const endMins = bStart + b.durMins;
          const endTimeStr = `${String(Math.floor(endMins/60)).padStart(2,'0')}:${String(endMins%60).padStart(2,'0')}`;

          if (isOff) {
            block.innerHTML = `
              <div>
                <div class="text-[9px] font-mono font-bold flex justify-between">
                  <span>${b.startTime}-${endTimeStr}</span><span>[休]</span>
                </div>
                <div class="font-bold text-xs mt-0.5 truncate">☕ ${b.custName || '排休'}</div>
              </div>
            `;
          } else {
            block.innerHTML = `
              <div>
                <div class="flex justify-between items-center text-[9px] font-mono opacity-90 pb-0.5 border-b border-white/20">
                  <span>${b.startTime}-${endTimeStr}</span>
                  <span class="font-bold bg-black/20 px-1 rounded">${b.durMins}分</span>
                </div>
                <div class="font-bold text-xs truncate mt-0.5">${b.custName} <span class="font-normal text-[9px]">(${b.custPhone.slice(-4)})</span></div>
                <div class="text-[9.5px] truncate font-medium opacity-95">${b.serviceName}</div>
              </div>
              ${b.resource && b.resource !== 'none' ? `<div class="text-[8.5px] bg-black/25 rounded px-1 py-0.5 inline-block truncate mt-auto"><i class="fa-solid fa-chair text-[7px] mr-0.5"></i>${b.resource}</div>` : ''}
            `;
          }

          block.onclick = (e) => {
            e.stopPropagation();
            viewBookingDetail(b.id);
          };

          container.appendChild(block);
        });
      });
    }

    // 4. 插單排程操作與 15/30/60 分鐘間隔切換
    let currentSlotStep = 30;

    function setSlotStep(step) {
      currentSlotStep = Number(step);
      [15, 30, 60].forEach(s => {
        const btn = document.getElementById(`btn-step-${s}`);
        if (!btn) return;
        if (s === currentSlotStep) {
          btn.className = "px-1.5 py-0.5 rounded border border-[#8C7355] bg-[#8C7355] text-white font-mono font-bold";
        } else {
          btn.className = "px-1.5 py-0.5 rounded border border-brand-200 bg-white font-mono font-bold text-brand-700";
        }
      });
      const curSelectedTime = document.getElementById('book-start-time').value;
      populateTimeSelectOptions(curSelectedTime);
    }

    function populateTimeSelectOptions(targetTimeStr) {
      const selectEl = document.getElementById('book-start-time');
      if (!selectEl) return;

      const [startH, startM] = (scheduleConfig.startTime || "09:00").split(':').map(Number);
      const [endH, endM] = (scheduleConfig.endTime || "21:00").split(':').map(Number);
      const totalStartMins = startH * 60 + (startM || 0);
      const totalEndMins = endH * 60 + (endM || 0);

      let html = '';
      for (let m = totalStartMins; m <= totalEndMins; m += currentSlotStep) {
        const hh = String(Math.floor(m / 60)).padStart(2, '0');
        const mm = String(m % 60).padStart(2, '0');
        const tStr = `${hh}:${mm}`;
        html += `<option value="${tStr}">${tStr}</option>`;
      }
      selectEl.innerHTML = html;

      if (targetTimeStr) {
        selectEl.value = targetTimeStr;
        if (!selectEl.value) {
          const opt = new Option(targetTimeStr, targetTimeStr, true, true);
          selectEl.add(opt);
          selectEl.value = targetTimeStr;
        }
      }
    }

    function onEmptySlotClicked(staffId, staffName, timeStr) {
      pendingSlotInsert = { staffId, staffName, timeStr };
      document.getElementById('modal-slot-title').innerText = `${selectedDate} 快速排程`;
      document.getElementById('modal-slot-meta').innerText = `指定專員：${staffName} (${staffId})`;

      setSlotStep(scheduleConfig.interval || 30);
      populateTimeSelectOptions(timeStr);

      document.getElementById('book-phone').value = '';
      document.getElementById('book-name').value = '';
      document.getElementById('book-line').value = '';
      document.getElementById('book-note').value = '';
      document.getElementById('book-cust-hint').classList.add('hidden');

      switchBookingMode('booking');
      document.getElementById('booking-modal').classList.remove('hidden');
    }

    function closeBookingModal() {

    function checkStaffConflict(staffId, date, startTime, durMins) {
      const [sh, sm] = startTime.split(':').map(Number);
      const newStart = sh * 60 + sm;
      const newEnd = newStart + durMins;

      const sameStaffBookings = bookingsDb.filter(b => b.date === date && b.staffId === staffId);
      for (let b of sameStaffBookings) {
        const [bh, bm] = b.startTime.split(':').map(Number);
        const bStart = bh * 60 + bm;
        const bEnd = bStart + b.durMins;
        if (newStart < bEnd && newEnd > bStart) {
          if (b.type === 'Group_B' || b.isOff) return true;
        }
      }
      return false;
    }

    function checkResourceCapacity(resourceName, date, startTime, durMins) {
      const resObj = storeResources.find(r => r.name === resourceName);
      if (!resObj) return false;

      const [sh, sm] = startTime.split(':').map(Number);
      const newStart = sh * 60 + sm;
      const newEnd = newStart + durMins;

      const activeResCount = bookingsDb.filter(b => {
        if (b.date !== date || b.resource !== resourceName) return false;
        const [bh, bm] = b.startTime.split(':').map(Number);
        const bStart = bh * 60 + bm;
        const bEnd = bStart + b.durMins;
        return (newStart < bEnd && newEnd > bStart);
      }).length;

      return activeResCount >= resObj.capacity;
    }

    // 儲存營業時間與公休至雲端
    async function saveBusinessSettings() {
      const startVal = document.getElementById('cfg-open-start').value;
      const endVal = document.getElementById('cfg-open-end').value;

      if (startVal >= endVal) {
        return Swal.fire('營業時間有誤', '結束時間必須大於開始營業時間！', 'warning');
      }

      scheduleConfig.startTime = startVal;
      scheduleConfig.endTime = endVal;
      scheduleConfig.interval = Number(document.getElementById('cfg-slot-interval').value) || 30;

      const weekly = [];
      document.querySelectorAll('.cfg-weekly-cb:checked').forEach(cb => weekly.push(Number(cb.value)));
      scheduleConfig.weeklyOff = weekly;

      Swal.fire({
        title: '正在儲存設定並同步畫布...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        await saveOverviewConfigToCloud();
        initDateCapsulesBar();
        renderGanttCanvas();
        Swal.fire({
          title: `營業時間與公休已更新（間隔 ${scheduleConfig.interval} 分鐘）！`,
          icon: 'success',
          timer: 1000,
          showConfirmButton: false
        });
      } catch (err) {
        Swal.fire('儲存失敗', err.message || '請檢查連線狀態', 'error');
      }
    }

    // 6. 雲端同步核心（帶有 UUID 防呆與本地離線 Fallback）
    async function saveOverviewConfigToCloud() {
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(currentStore.id);

      if (!isUuid || currentStore.id === "default-store") {
        localStorage.setItem('overview_local_config', JSON.stringify({
          staffList,
          serviceCatalog,
          storeResources,
          scheduleConfig
        }));
        return;
      }

      try {
        let existingConfig = {};
        try {
          const fetchRes = await fetch(`${SUPABASE_URL}/rest/v1/tool_settings?store_id=eq.${currentStore.id}&select=slot_config`, {
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          });
          const existingData = await fetchRes.json();
          if (existingData && existingData.length > 0 && existingData[0].slot_config) {
            existingConfig = existingData[0].slot_config;
          }
        } catch (e) {
          console.warn("無法取得既有設定，直接寫入");
        }

        existingConfig.overview_config = {
          staffList,
          serviceCatalog,
          storeResources,
          scheduleConfig
        };

        const res = await fetch(`${SUPABASE_URL}/rest/v1/tool_settings?on_conflict=store_id`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
          },
          body: JSON.stringify({
            store_id: currentStore.id,
            slot_config: existingConfig,
            updated_at: new Date().toISOString()
          })
        });

        if (!res.ok) throw new Error(await res.text());
      } catch (e) {
        console.error("雲端同步異常:", e);
        throw e;
      }
    }

              <select id="as-type" class="w-full p-2.5 rounded-xl border border-gray-300 text-xs mt-1 outline-none">
                <option value="Group_B">Group B (全程專屬類，時段鎖定禁止重疊)</option>
                <option value="Group_A">Group A (等待期技術類，靜置期允許插單)</option>
              </select>
            </div>
            <div>
              <label class="font-bold">佔用設備席位 (防撞)：</label>
              <select id="as-res" class="w-full p-2.5 rounded-xl border border-gray-300 text-xs mt-1 outline-none">
                <option value="none">無 (不佔用限制設備)</option>
                ${resOptions}
              </select>
            </div>
          </div>
        `,
        preConfirm: () => ({
          category: document.getElementById('as-cat').value.trim() || '現場主要服務',
          name: document.getElementById('as-name').value.trim(),
          price: Number(document.getElementById('as-price').value || 0),
          dur: Number(document.getElementById('as-dur').value || 60),
          type: document.getElementById('as-type').value,
          resource: document.getElementById('as-res').value
        })
      });
      if (v && v.name) {
        serviceCatalog.push({ id: `srv-${Date.now().toString().slice(-4)}`, ...v });
        renderAdminServicesList();
        await saveOverviewConfigToCloud();
      }
    }

    // 席位容量管理
    function renderAdminResourcesList() {
      const container = document.getElementById('admin-resources-list');
      container.innerHTML = storeResources.map((r, idx) => `
        <div class="p-2.5 bg-white rounded-xl border border-brand-200 flex justify-between items-center text-xs shadow-2xs">
          <span>設備：<b>${r.name}</b> ｜ 容量上限：<b class="font-mono text-[#8C7355] text-sm">${r.capacity}</b> 組席位</span>
          <div class="flex items-center gap-1">
            <button type="button" onclick="moveResourceOrder(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-20"' : ''} class="w-6 h-6 rounded bg-brand-50 border flex items-center justify-center font-bold">▲</button>
            <button type="button" onclick="moveResourceOrder(${idx}, 1)" ${idx === storeResources.length - 1 ? 'disabled class="opacity-20"' : ''} class="w-6 h-6 rounded bg-brand-50 border flex items-center justify-center font-bold">▼</button>
            <button type="button" onclick="deleteResourceById('${r.id}')" class="w-6 h-6 rounded bg-rose-50 text-rose-600 flex items-center justify-center ml-1">✕</button>
          </div>
        </div>
      `).join('');
    }

    async function moveResourceOrder(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= storeResources.length) return;
      const tmp = storeResources[idx];
      storeResources[idx] = storeResources[target];
      storeResources[target] = tmp;
      renderAdminResourcesList();
      await saveOverviewConfigToCloud();
    }

    async function deleteResourceById(id) {
      storeResources = storeResources.filter(r => r.id !== id);
      renderAdminResourcesList();
      await saveOverviewConfigToCloud();
    }

    async function openAddResourceModal() {
      const { value: v } = await Swal.fire({
        title: '新增限制硬體席位',
        html: `
          <div class="text-left text-xs space-y-2">
            <div><label class="font-bold">設備名稱：</label><input id="ar-name" class="swal2-input text-xs" placeholder="例: 雙人光療桌 / VIP包廂"></div>
            <div><label class="font-bold">全店容量上限：</label><input id="ar-cap" type="number" class="swal2-input text-xs font-mono" value="1"></div>
          </div>
        `,
        preConfirm: () => ({ name: document.getElementById('ar-name').value.trim(), capacity: Number(document.getElementById('ar-cap').value || 1) })
      });
      if (v && v.name) {
        storeResources.push({ id: `res-${Date.now().toString().slice(-4)}`, ...v });
        renderAdminResourcesList();
        await saveOverviewConfigToCloud();
      }
    }

    // 顧客資料庫
    function updateFilteredCustList() {
      filteredCustList = Object.values(customerDb);
      renderCustomerTable();
    }

    function filterCustomerList() {
      const q = document.getElementById('cust-search-input').value.trim().toLowerCase();
      if (!q) {
        filteredCustList = Object.values(customerDb);
      } else {
        filteredCustList = Object.values(customerDb).filter(c => 
          (c.phone && c.phone.includes(q)) ||
          (c.name && c.name.toLowerCase().includes(q)) ||
          (c.line && c.line.toLowerCase().includes(q))
        );
      }
      custCurrentPage = 1;
      renderCustomerTable();
    }

    function renderCustomerTable() {
      const container = document.getElementById('admin-customers-table');
      const pageInfo = document.getElementById('cust-page-info');
      const btns = document.getElementById('cust-page-btns');

      if (filteredCustList.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-brand-400">目前尚無符合的顧客資料</div>';
        pageInfo.innerText = '共 0 位顧客';
        btns.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(filteredCustList.length / CUST_PAGE_SIZE) || 1;
      if (custCurrentPage > totalPages) custCurrentPage = totalPages;

      const start = (custCurrentPage - 1) * CUST_PAGE_SIZE;
      const end = Math.min(start + CUST_PAGE_SIZE, filteredCustList.length);
      const paged = filteredCustList.slice(start, end);

      pageInfo.innerText = `顯示第 ${start + 1} - ${end} 位（共 ${filteredCustList.length} 位顧客）`;

      container.innerHTML = paged.map(c => `
        <div class="p-3 bg-white rounded-2xl border border-brand-200 flex justify-between items-center text-xs shadow-2xs">
          <div>
            <div class="font-bold text-brand-900">${c.name} <span class="font-mono text-gray-400 font-normal ml-1">(${c.phone})</span></div>
            <div class="text-[10px] text-brand-500 mt-0.5">LINE: <b>${c.line || '未填'}</b> ｜ 累計排程預約：<b>${c.visits || 1}</b> 次</div>
          </div>
          <button type="button" onclick="selectCustToBook('${c.phone}')" class="px-3 py-1.5 bg-[#8C7355] text-white rounded-xl text-xs font-bold hover:bg-[#7A6246] transition">
            帶入預約
          </button>
        </div>
      `).join('');

      btns.innerHTML = `
        <button type="button" onclick="changeCustPage(${custCurrentPage - 1})" ${custCurrentPage === 1 ? 'disabled class="opacity-30"' : ''} class="px-2 py-1 bg-white border rounded text-[11px] font-bold">上一頁</button>
        <span class="px-2 py-1 font-mono font-bold text-brand-700">${custCurrentPage} / ${totalPages}</span>
        <button type="button" onclick="changeCustPage(${custCurrentPage + 1})" ${custCurrentPage === totalPages ? 'disabled class="opacity-30"' : ''} class="px-2 py-1 bg-white border rounded text-[11px] font-bold">下一頁</button>
      `;
    }

    function changeCustPage(p) {
      custCurrentPage = p;
      renderCustomerTable();
    }

    function selectCustToBook(phone) {
      if (customerDb[phone]) {
        closeManagerModal();
        onEmptySlotClicked(staffList[0].id, staffList[0].name, '11:00');
        document.getElementById('book-phone').value = phone;
        lookupCustomer(phone);
      }
    }

    function exportCustomersCsv() {
      const list = Object.values(customerDb);
      if (list.length === 0) return Swal.fire('尚無顧客名冊可匯出', '', 'info');
      let csv = "data:text/csv;charset=utf-8,\uFEFF";
      csv += "顧客姓名,手機號碼,LINE稱呼,累計排程次數\n";
      list.forEach(c => {
        csv += `"${c.name}","${c.phone}","${c.line || ''}",${c.visits || 1}\n`;
      });
      const a = document.createElement("a");
      a.href = encodeURI(csv);
      a.download = `${currentStore.store_name}_排程顧客名冊.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function saveBookingsDb() {
      localStorage.setItem('overview_bookings_data', JSON.stringify(bookingsDb));
    }

    function saveCustomerDb() {
      localStorage.setItem('overview_customers_db', JSON.stringify(customerDb));
    }

    function getTodayDateStr() {
      return formatYearMonthDay(new Date());
    }

    function formatYearMonthDay(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderAuditLogsTable() {
      const container = document.getElementById('admin-audit-table');
      if (!container) return;
      if (bookingsDb.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-brand-400">目前尚無任何插單紀錄</div>';
        return;
      }
      container.innerHTML = bookingsDb.slice().reverse().map(b => {
        const staffObj = staffList.find(s => s.id === b.staffId);
        const sName = staffObj ? `${staffObj.name} (${staffObj.id})` : b.staffId;
        const createdTime = b.createdAt || "歷史既有資料";

        return `
          <div class="p-2.5 bg-white rounded-xl border border-brand-200 text-xs shadow-2xs space-y-1">
            <div class="flex justify-between font-bold">
              <span class="text-brand-900">${b.date} ${b.startTime} - ${b.serviceName}</span>
              <span class="text-[#8C7355]">${sName}</span>
            </div>
            <div class="text-[10.5px] text-brand-600 flex justify-between">
              <span>顧客：${b.custName} (${b.custPhone})</span>
              <span class="font-mono text-stone-400">ID: ${b.id}</span>
            </div>
            <!-- 插單當下系統時間戳記 -->
            <div class="text-[9.5px] text-brand-400 border-t border-brand-100 pt-1 flex items-center justify-between font-mono">
              <span><i class="fa-regular fa-clock mr-1"></i>操作時間：${createdTime}</span>
              <span class="text-emerald-700 font-bold">✓ 已入庫</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // [優化] 三欄位任意比對顧客庫
    function lookupCustomerAny() {
      const p = document.getElementById('book-phone').value.trim();
      const n = document.getElementById('book-name').value.trim();
      const l = document.getElementById('book-line').value.trim();
      const hint = document.getElementById('book-cust-hint');

      const allCusts = Object.values(customerDb);
      const found = allCusts.find(c => 
        (p && c.phone === p) || 
        (n && c.name === n) || 
        (l && c.line === l)
      );

      if (found) {
        document.getElementById('book-phone').value = found.phone;
        document.getElementById('book-name').value = found.name;
        document.getElementById('book-line').value = found.line || '';
        hint.innerHTML = `✓ 舊客檔案帶入：<b>${found.name}</b> (LINE: ${found.line || '未填'}) ｜ 累計排程 ${found.visits || 1} 次`;
        hint.classList.remove('hidden');
      } else {
        hint.classList.add('hidden');
      }
    }

    // [新增] 服務項目編輯功能 (含可施作專員)
    async function openEditOverviewServiceModal(idx) {
      const s = serviceCatalog[idx];
      const resOptions = storeResources.map(r => `<option value="${r.name}" ${r.name === s.resource ? 'selected' : ''}>${r.name} (容量:${r.capacity})</option>`).join('');
      const staffCheckboxes = staffList.map(st => `
        <label class="inline-flex items-center gap-1 mr-3 cursor-pointer">
          <input type="checkbox" value="${st.id}" class="edit-staff-cb accent-[#8C7355]" ${(s.allowedStaff || []).includes(st.id) ? 'checked' : ''}>
          <span>${st.name}</span>
        </label>
      `).join('');

      const { value: v } = await Swal.fire({
        title: '編輯排程服務主檔',
        html: `
          <div class="text-left text-xs space-y-2">
            <div><label class="font-bold">項目名稱：</label><input id="eos-name" class="swal2-input text-xs" value="${s.name}"></div>
            <div class="grid grid-cols-2 gap-2">
              <div><label class="font-bold">金額：</label><input id="eos-price" type="number" class="swal2-input text-xs font-mono" value="${s.price}"></div>
              <div><label class="font-bold">耗時(分)：</label><input id="eos-dur" type="number" class="swal2-input text-xs font-mono" value="${s.dur}"></div>
            </div>
            <div>
              <label class="font-bold">插單屬性：</label>
              <select id="eos-type" class="w-full p-2.5 rounded-xl border mt-1">
                <option value="Group_B" ${s.type === 'Group_B' ? 'selected' : ''}>Group B (全程專屬類)</option>
                <option value="Group_A" ${s.type === 'Group_A' ? 'selected' : ''}>Group A (允許雙單穿插)</option>
              </select>
            </div>
            <div>
              <label class="font-bold">佔用設備：</label>
              <select id="eos-res" class="w-full p-2.5 rounded-xl border mt-1"><option value="none">無</option>${resOptions}</select>
            </div>
            <div class="pt-1">
              <label class="font-bold block mb-1">可施作專員：</label>
              <div class="p-2 bg-brand-50 rounded-xl border border-brand-200">${staffCheckboxes}</div>
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '儲存更新',
        confirmButtonColor: '#8C7355',
        preConfirm: () => {
          const staffChecked = Array.from(document.querySelectorAll('.edit-staff-cb:checked')).map(cb => cb.value);
          return {
            name: document.getElementById('eos-name').value.trim(),
            price: Number(document.getElementById('eos-price').value || 0),
            dur: Number(document.getElementById('eos-dur').value || 60),
            type: document.getElementById('eos-type').value,
            resource: document.getElementById('eos-res').value,
            allowedStaff: staffChecked
          };
        }
      });

      if (v) {
        serviceCatalog[idx] = Object.assign(serviceCatalog[idx], v);
        renderAdminServicesList();
        await saveOverviewConfigToCloud();
      }
    }
  </script>
</body>
</html>
