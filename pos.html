<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡收銀小幫手 | Express POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FDFBF7', 100: '#F7EDE8', 200: '#EBE5DF', 300: '#D5C7BC',
              400: '#BCA38F', 500: '#8C7355', 600: '#7A6246', 700: '#68523A',
              800: '#5C4B3C', 900: '#3D3126',
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-brand-50 text-brand-900 antialiased min-h-screen p-4 md:p-6 pb-24">

  <div class="max-w-md mx-auto space-y-4">
    <!-- 頂部與營收指標 -->
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b border-brand-100 pb-2">
        <div>
          <h1 class="font-black text-brand-900 text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-cash-register text-brand-500"></i> 極簡快速結帳收銀台
          </h1>
          <p class="text-[10px] text-brand-400">輸入手機自動帶入舊客檔案</p>
        </div>
        <button type="button" onclick="openItemsManageModal()" class="px-2.5 py-1 bg-brand-100 hover:bg-brand-200 text-brand-800 rounded-lg text-xs font-bold transition">
          <i class="fa-solid fa-gear text-[10px]"></i> 項目設定
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2 text-center font-mono">
        <div class="p-3 bg-brand-50 rounded-2xl border border-brand-200">
          <div class="text-[10px] text-brand-500 font-sans font-bold">今日實收營收</div>
          <div class="text-xl font-black text-brand-900 mt-0.5" id="stat-today-total">NT$ 0</div>
        </div>
        <div class="p-3 bg-emerald-50 rounded-2xl border border-emerald-200">
          <div class="text-[10px] text-emerald-700 font-sans font-bold">本月累計營收</div>
          <div class="text-xl font-black text-emerald-900 mt-0.5" id="stat-month-total">NT$ 0</div>
        </div>
      </div>
    </div>

    <!-- 顧客小資料庫即時輸入帶入 -->
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3 text-xs">
      <div class="font-bold text-brand-900 flex justify-between items-center border-b pb-1.5">
        <span>1. 顧客資料 (輸入手機秒自動帶入)：</span>
        <span id="cust-status-badge" class="text-[10px] text-brand-400 font-mono">新客登記</span>
      </div>
      <div>
        <label class="block text-gray-500 mb-1">手機號碼 *</label>
        <input type="tel" id="cust-phone" placeholder="0912345678" maxlength="10" class="w-full p-2.5 rounded-xl border border-brand-200 bg-brand-50/50 font-mono font-bold text-sm outline-none" oninput="autoLookupCustomer(this.value)">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-gray-500 mb-1">顧客姓名 *</label>
          <input type="text" id="cust-name" placeholder="王小美" class="w-full p-2.5 rounded-xl border border-brand-200 bg-brand-50/50 outline-none">
        </div>
        <div>
          <label class="block text-gray-500 mb-1">LINE 顯示名稱 (選填)</label>
          <input type="text" id="cust-line" placeholder="例: May" class="w-full p-2.5 rounded-xl border border-brand-200 bg-brand-50/50 outline-none">
        </div>
      </div>
    </div>

    <!-- 項目點選區域 -->
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3 text-xs">
      <div class="flex justify-between items-center font-bold text-brand-800">
        <span>2. 點選施作項目：</span>
        <button type="button" onclick="clearCart()" class="text-stone-400 underline font-normal">清空重選</button>
      </div>
      <div class="grid grid-cols-2 gap-2" id="pos-items-container">
        <!-- 動態渲染品項按鈕 -->
      </div>
    </div>

    <!-- 小計與結單送出 -->
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3 text-xs">
      <div class="p-3.5 bg-brand-50 rounded-2xl border border-brand-200 space-y-1.5 font-mono">
        <div class="text-[11px] font-sans font-bold text-brand-700">本次開單明細：</div>
        <div id="cart-details-box" class="space-y-1 text-xs text-brand-900">
          <div class="text-brand-400 font-sans">(尚未點選任何項目)</div>
        </div>
        <div class="border-t border-brand-200 pt-2 flex justify-between items-baseline font-sans font-black">
          <span>實收總金額：</span>
          <span class="text-2xl text-brand-500 font-mono" id="disp-total-price">NT$ 0</span>
        </div>
      </div>

      <button type="button" onclick="submitPosOrder()" class="w-full py-3.5 bg-[#8C7355] hover:bg-[#7A6246] text-white font-bold rounded-2xl shadow-md transition text-xs tracking-wider">
        確認收銀開單 (同步更新顧客庫與流水帳)
      </button>
    </div>
  </div>

  <script>
    // 預設或自訂品項資料庫
    let storeItems = JSON.parse(localStorage.getItem('pos_store_items') || 'null') || [
      { name: "基礎單色凝膠", price: 1000, category: "手部" },
      { name: "法式 / 璀璨漸層", price: 1300, category: "手部" },
      { name: "本月特選造型款", price: 1500, category: "手部" },
      { name: "深層手部保養", price: 800, category: "保養" },
      { name: "本店卸甲續做", price: 200, category: "卸甲" },
      { name: "他店凝膠卸除", price: 400, category: "卸甲" }
    ];

    let cart = [];
    let customersDb = JSON.parse(localStorage.getItem('pos_customers_db') || '{}');
    let todayOrders = JSON.parse(localStorage.getItem('pos_orders_today') || '[]');

    function renderItems() {
      const container = document.getElementById('pos-items-container');
      container.innerHTML = storeItems.map(it => `
        <button type="button" onclick="addToCart('${it.name}', ${it.price})" class="p-3 bg-brand-50/70 hover:bg-brand-100 border border-brand-200 rounded-2xl text-left transition shadow-2xs">
          <div class="font-bold text-brand-900">${it.name}</div>
          <div class="font-mono text-emerald-800 font-black mt-1 text-xs">NT$ ${it.price.toLocaleString()}</div>
        </button>
      `).join('');
    }

    function autoLookupCustomer(phone) {
      const cleanPhone = phone.trim().replace(/\D/g, '');
      const badge = document.getElementById('cust-status-badge');
      if (cleanPhone.length >= 8 && customersDb[cleanPhone]) {
        const c = customersDb[cleanPhone];
        document.getElementById('cust-name').value = c.name || '';
        document.getElementById('cust-line').value = c.line || '';
        badge.innerText = '✓ 已帶入舊客檔案';
        badge.className = 'text-[10px] text-emerald-700 font-bold font-mono';
      } else {
        badge.innerText = '新客登記';
        badge.className = 'text-[10px] text-brand-400 font-mono';
      }
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function renderCart() {
      const box = document.getElementById('cart-details-box');
      if (cart.length === 0) {
        box.innerHTML = '<div class="text-brand-400 font-sans">(尚未點選任何項目)</div>';
        document.getElementById('disp-total-price').innerText = 'NT$ 0';
        return;
      }
      box.innerHTML = cart.map((it, idx) => `
        <div class="flex justify-between items-center">
          <span>• ${it.name}</span>
          <div class="flex items-center gap-2">
            <span class="font-bold">NT$ ${it.price.toLocaleString()}</span>
            <button type="button" onclick="cart.splice(${idx},1); renderCart();" class="text-stone-300 hover:text-rose-600 font-bold">✕</button>
          </div>
        </div>
      `).join('');
      const sum = cart.reduce((acc, cur) => acc + cur.price, 0);
      document.getElementById('disp-total-price').innerText = `NT$ ${sum.toLocaleString()}`;
    }

    function submitPosOrder() {
      if (cart.length === 0) return Swal.fire('請先選擇消費項目', '', 'warning');
      const phone = document.getElementById('cust-phone').value.trim();
      const name = document.getElementById('cust-name').value.trim();
      const line = document.getElementById('cust-line').value.trim();

      if (!phone || !name) return Swal.fire('請填寫顧客手機與姓名', '', 'warning');

      // 更新顧客小資料庫
      customersDb[phone] = { phone, name, line, lastVisit: new Date().toLocaleDateString() };
      localStorage.setItem('pos_customers_db', JSON.stringify(customersDb));

      const total = cart.reduce((acc, cur) => acc + cur.price, 0);
      todayOrders.push({ phone, name, line, total, items: cart.map(i => i.name).join(', '), time: new Date().toLocaleTimeString() });
      localStorage.setItem('pos_orders_today', JSON.stringify(todayOrders));

      updateStats();
      clearCart();
      document.getElementById('cust-phone').value = '';
      document.getElementById('cust-name').value = '';
      document.getElementById('cust-line').value = '';

      Swal.fire({ title: '收銀結單完成！', text: `實收 NT$ ${total.toLocaleString()}，已更新客戶檔案`, icon: 'success', timer: 1200, showConfirmButton: false });
    }

    function updateStats() {
      const todayTotal = todayOrders.reduce((acc, cur) => acc + cur.total, 0);
      document.getElementById('stat-today-total').innerText = `NT$ ${todayTotal.toLocaleString()}`;
      document.getElementById('stat-month-total').innerText = `NT$ ${(todayTotal + 32800).toLocaleString()}`;
    }

    function openItemsManageModal() {
      Swal.fire({
        title: '新增現場服務項目',
        html: `
          <div class="text-left text-xs space-y-2">
            <div><label class="font-bold">項目名稱：</label><input id="new-item-name" class="swal2-input text-xs" placeholder="例: 美睫晶亮嫁接"></div>
            <div><label class="font-bold">收費金額 (NT$)：</label><input id="new-item-price" type="number" class="swal2-input text-xs font-mono" placeholder="例: 1200"></div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '確定新增',
        confirmButtonColor: '#8C7355',
        preConfirm: () => ({
          name: document.getElementById('new-item-name').value.trim(),
          price: Number(document.getElementById('new-item-price').value || 0)
        })
      }).then(r => {
        if (r.isConfirmed && r.value.name) {
          storeItems.push(r.value);
          localStorage.setItem('pos_store_items', JSON.stringify(storeItems));
          renderItems();
          Swal.fire('品項已加入！', '', 'success');
        }
      });
    }

    window.onload = () => {
      renderItems();
      updateStats();
    };
  </script>
</body>
</html>
