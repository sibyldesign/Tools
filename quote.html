<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>服務報價試算與線上預約預估</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF8F5', 100: '#F5ECE3', 200: '#EBE5DF', 300: '#D5C7BC',
              400: '#BCA38F', 500: '#8C7355', 600: '#7A6246', 700: '#68523A',
              800: '#5C4B3C', 900: '#3D3126',
            }
          },
          fontFamily: {
            sans: ['Noto Sans TC', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    };
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* 9:16 輪播框高斯模糊背景層 */
    .blur-backdrop {
      filter: blur(22px);
      transform: scale(1.18);
      opacity: 0.65;
    }
  </style>
</head>
<body class="bg-brand-50 text-brand-900 antialiased min-h-screen pb-28 selection:bg-brand-200">

  <!-- 頂部沙龍抬頭 -->
  <header class="bg-white/95 backdrop-blur-md border-b border-brand-200 sticky top-0 z-30 px-4 py-3 shadow-2xs">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-sm font-bold text-brand-900 flex items-center gap-1.5" id="quote-store-name">
          <i class="fa-solid fa-calculator text-[#8C7355]"></i>
          <span>沙龍服務價目試算器</span>
        </h1>
        <p class="text-[10px] text-brand-400 font-mono" id="quote-store-sub">Transparent Price Estimator</p>
      </div>
      <a id="header-line-btn" href="#" target="_blank" class="px-3 py-1.5 bg-[#1F4E3D] hover:bg-[#183E30] text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs">
        <i class="fa-brands fa-line text-sm"></i>
        <span>聯繫店家</span>
      </a>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- 1. 9:16 活動宣傳與價目輪播圖 (高斯模糊補底 + 白點進度) -->
    <section class="bg-stone-900 rounded-3xl overflow-hidden shadow-lg border border-brand-200 relative">
      <div class="w-full aspect-[9/16] max-h-[460px] relative overflow-hidden flex items-center justify-center">
        <!-- 模糊底圖 -->
        <div id="carousel-blur-bg" class="absolute inset-0 bg-cover bg-center blur-backdrop pointer-events-none transition-all duration-700"></div>
        <div class="absolute inset-0 bg-black/25 z-0 pointer-events-none"></div>

        <!-- 清晰前景圖 -->
        <img id="carousel-main-img" src="" alt="店內價目與活動介紹" class="max-h-full max-w-full object-contain relative z-10 transition-all duration-500 drop-shadow-2xl">

        <!-- 左右切換鍵 -->
        <button type="button" onclick="prevSlide()" class="absolute left-2.5 z-20 w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-sm transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button type="button" onclick="nextSlide()" class="absolute right-2.5 z-20 w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-sm transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>

        <!-- 底部進度白點 -->
        <div class="absolute bottom-3 inset-x-0 z-20 flex justify-center items-center gap-1.5" id="carousel-dots-container"></div>
      </div>
    </section>

    <!-- 2. 主服務項目挑選 (分類切換 ＋ 單選/複選) -->
    <section class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-brand-100">
        <div>
          <h2 class="text-xs font-black text-brand-900">1. 選擇預約服務核心項目</h2>
          <p class="text-[10px] text-brand-400 mt-0.5">點擊品項選取本次欲施作的主要服務</p>
        </div>
        <span class="text-[10.5px] font-mono text-[#8C7355] font-bold" id="selected-service-badge">尚未選擇</span>
      </div>

      <!-- 分類標籤滑動條 -->
      <div class="flex gap-2 overflow-x-auto no-scrollbar py-0.5" id="quote-category-tabs"></div>

      <!-- 項目清單按鈕網格 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="quote-services-grid"></div>
    </section>

    <!-- 3. 全行業通用：附加升級、深層護理與工藝加值 (可多選) -->
    <section class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3.5">
      <div class="flex justify-between items-center pb-2 border-b border-brand-100">
        <div>
          <h2 class="text-xs font-black text-brand-900">2. 附加升級、專屬護理與工藝選購</h2>
          <p class="text-[10px] text-brand-400 mt-0.5">美髮修護 / 美甲工藝 / 美睫升級 / 寵美泥浴 皆適用</p>
        </div>
        <span class="text-[10px] text-brand-400" id="addons-count-badge">可自由多選</span>
      </div>

      <div class="space-y-2" id="quote-addons-container"></div>
    </section>

    <!-- 4. 費用試算明細與高美感 LINE 預約按鈕 -->
    <section class="bg-white p-5 rounded-3xl border border-brand-200 shadow-md space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-brand-100">
        <span class="text-xs font-bold text-brand-900 flex items-center gap-1.5">
          <i class="fa-solid fa-receipt text-[#8C7355]"></i> 預估報價試算清單
        </span>
        <button type="button" onclick="resetQuoteCart()" class="text-[10.5px] text-rose-500 font-bold hover:underline">重新試算</button>
      </div>

      <div class="space-y-2 text-xs" id="quote-cart-items">
        <div class="text-center py-4 text-brand-400">請從上方選取服務品項</div>
      </div>

      <!-- 總額統計 -->
      <div class="p-3.5 bg-brand-50 rounded-2xl border border-brand-100 flex justify-between items-center">
        <div>
          <span class="text-[10px] text-brand-400 block font-sans">線上預估參考金額</span>
          <span class="text-2xl font-black font-mono text-brand-700" id="quote-total-price">NT$ 0</span>
        </div>
        <div class="text-right text-[10px] text-brand-400">
          現場依實際毛況/甲況評估為準<br>不含現場臨時特惠折扣
        </div>
      </div>

      <!-- 重構之高美感深林墨綠預約按鈕 -->
      <button type="button" onclick="copyQuoteAndRedirectLine()" class="w-full py-3.5 bg-[#1F4E3D] hover:bg-[#183E30] text-white rounded-2xl text-xs font-bold tracking-wide transition shadow-md flex items-center justify-center gap-2 group">
        <i class="fa-brands fa-line text-lg text-emerald-300 group-hover:scale-110 transition-transform"></i>
        <span>複製報價明細，前往官方 LINE 預約時段</span>
      </button>

      <p class="text-[10px] text-center text-brand-400">
        點擊將自動為您複製試算項目，並打開 LINE 貼上傳送給美療師確認空檔。
      </p>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://tzqpfnrpnfzzubofoqlt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6cXBmbnJwbmZ6enVib2ZvcWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODQ5ODYsImV4cCI6MjEwODE2MDk4Nn0.B-ub7DCpzF3b2gjpTrM9jdW0SLOqRPillZTmoXPuNgk";

    let currentStore = {
      id: "default",
      store_name: "希貝兒沙龍美學工作室",
      line_url: "https://line.me/R/ti/p/@480kqjoj"
    };

    // 全行業通用報價架構
    let quoteConfig = {
      lineUrl: "https://line.me/R/ti/p/@480kqjoj",
      carouselImages: [
        "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=720&q=80",
        "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=720&q=80"
      ],
      categories: ["主推核心", "深層保養", "工藝升級", "特殊護理"],
      services: [
        { id: "s1", name: "頂級日式美睫/美甲光療基本款", category: "主推核心", price: 1200, note: "含基礎指緣/眼周護理與甲型修飾" },
        { id: "s2", name: "沙龍晶透水感深層臉部護理", category: "深層保養", price: 1800, note: "含粉刺溫和微創淨化與鎖水導入" },
        { id: "s3", name: "毛孩草本精油深層泥浴SPA", category: "深層保養", price: 1500, note: "鎮定放鬆、去除體味、深層毛囊調理" },
        { id: "s4", name: "設計染燙/縮毛矯正技術工藝", category: "主推核心", price: 2800, note: "依個人骨骼臉型客製化剪裁設計" }
      ],
      addons: [
        { id: "a1", name: "結構式深層鏈鍵強化護理", price: 500, desc: "大幅提升毛髮與甲面強韌度，持久保鮮" },
        { id: "a2", name: "客製化手繪彩繪 / 專屬指甲造型鑽飾", price: 400, desc: "單指精緻設計或重點圖騰跳色" },
        { id: "a3", name: "眼膜冷凝水光保濕貼片", price: 150, desc: "嫁接過程深層舒緩，淡化眼周乾燥細紋" },
        { id: "a4", name: "草本防護除蚤加強浸泡浴", price: 300, desc: "天然草本抑菌驅蟲，守護毛孩皮膚屏障" }
      ]
    };

    let selectedService = null;
    let selectedAddons = [];
    let activeCategory = "全部";
    let currentSlideIdx = 0;
    let slideTimer = null;

    window.addEventListener('DOMContentLoaded', async () => {
      await loadStoreQuoteProfile();
      initCarousel();
      renderCategoryTabs();
      renderServicesGrid();
      renderAddonsList();
      updateCartSummary();
    });

    // 1. 雙軌讀取專屬短代碼 (?s=slug 或 ?store_id=UUID)
    async function loadStoreQuoteProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const storeParam = urlParams.get('s') || urlParams.get('store') || urlParams.get('store_id');

      if (!storeParam) return;

      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(storeParam);
      const queryUrl = isUuid
        ? `${SUPABASE_URL}/rest/v1/tool_stores?id=eq.${storeParam}&select=*`
        : `${SUPABASE_URL}/rest/v1/tool_stores?store_slug=eq.${storeParam}&select=*`;

      try {
        const res = await fetch(queryUrl, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const stores = await res.json();
        if (stores && stores.length > 0) {
          currentStore = stores[0];
          document.getElementById('quote-store-name').innerHTML = `<i class="fa-solid fa-calculator text-[#8C7355]"></i> ${currentStore.store_name}`;
          document.getElementById('quote-store-sub').innerText = `專屬報價單 · ${currentStore.store_slug || currentStore.id.slice(0,8)}`;
          
          const lineBtn = document.getElementById('header-line-btn');
          lineBtn.href = currentStore.line_url || "https://line.me/R/ti/p/@480kqjoj";

          // 從 tool_settings 載入店家專屬價目表與輪播圖
          await loadCloudQuoteSettings(currentStore.id);
        }
      } catch (err) {
        console.warn("載入雲端報價資料失敗:", err);
      }
    }

    async function loadCloudQuoteSettings(storeId) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tool_settings?store_id=eq.${storeId}&select=*`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        if (data && data.length > 0) {
          const cfg = data[0];
          if (cfg.slot_config && cfg.slot_config.quote_config) {
            quoteConfig = Object.assign(quoteConfig, cfg.slot_config.quote_config);
          } else if (Array.isArray(cfg.quote_items) && cfg.quote_items.length > 0) {
            quoteConfig.services = cfg.quote_items;
          }
        }
      } catch (e) {
        console.error("載入小工具設定異常:", e);
      }
    }

    // 2. 9:16 輪播圖 (高斯模糊補底 + 白點指示)
    function initCarousel() {
      const images = quoteConfig.carouselImages || [];
      if (images.length === 0) return;

      const dotsContainer = document.getElementById('carousel-dots-container');
      dotsContainer.innerHTML = images.map((_, i) => `
        <button type="button" onclick="goToSlide(${i})" class="w-2 h-2 rounded-full transition-all duration-300 ${i === currentSlideIdx ? 'bg-white w-5' : 'bg-white/40'}"></button>
      `).join('');

      showSlide(currentSlideIdx);

      // 自動播放 (每 4.5 秒)
      if (slideTimer) clearInterval(slideTimer);
      slideTimer = setInterval(() => nextSlide(), 4500);
    }

    function showSlide(idx) {
      const images = quoteConfig.carouselImages || [];
      if (images.length === 0) return;

      currentSlideIdx = (idx + images.length) % images.length;
      const targetUrl = images[currentSlideIdx];

      const mainImg = document.getElementById('carousel-main-img');
      const blurBg = document.getElementById('carousel-blur-bg');

      mainImg.src = targetUrl;
      blurBg.style.backgroundImage = `url('${targetUrl}')`;

      const dots = document.querySelectorAll('#carousel-dots-container button');
      dots.forEach((dot, i) => {
        dot.className = `h-2 rounded-full transition-all duration-300 ${i === currentSlideIdx ? 'bg-white w-5' : 'bg-white/40 w-2'}`;
      });
    }

    function nextSlide() { showSlide(currentSlideIdx + 1); }
    function prevSlide() { showSlide(currentSlideIdx - 1); }
    function goToSlide(i) { showSlide(i); }

    // 3. 分類標籤切換
    function renderCategoryTabs() {
      const container = document.getElementById('quote-category-tabs');
      const cats = ["全部", ...(quoteConfig.categories || [])];

      container.innerHTML = cats.map(cat => `
        <button type="button" onclick="switchCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${
          activeCategory === cat ? 'bg-[#8C7355] text-white shadow-2xs' : 'bg-brand-100 text-brand-700 hover:bg-brand-200'
        }">
          ${cat}
        </button>
      `).join('');
    }

    function switchCategory(cat) {
      activeCategory = cat;
      renderCategoryTabs();
      renderServicesGrid();
    }

    // 4. 核心主服務項目渲染 (單選點擊)
    function renderServicesGrid() {
      const grid = document.getElementById('quote-services-grid');
      const list = (activeCategory === "全部")
        ? quoteConfig.services
        : quoteConfig.services.filter(s => s.category === activeCategory);

      if (list.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-6 text-center text-xs text-brand-400">此分類目前無項目</div>';
        return;
      }

      grid.innerHTML = list.map(svc => {
        const isSelected = selectedService && selectedService.id === svc.id;
        return `
          <button type="button" onclick="selectServiceItem('${svc.id}')" class="p-3.5 rounded-2xl border text-left transition flex flex-col justify-between gap-2 shadow-2xs ${
            isSelected 
              ? 'bg-[#8C7355] text-white border-[#8C7355]' 
              : 'bg-white hover:bg-brand-50 border-brand-200 text-brand-900'
          }">
            <div>
              <div class="flex justify-between items-start gap-2">
                <span class="font-bold text-xs leading-snug line-clamp-1">${svc.name}</span>
                <span class="font-mono font-black text-xs shrink-0 ${isSelected ? 'text-amber-200' : 'text-brand-700'}">NT$ ${svc.price.toLocaleString()}</span>
              </div>
              ${svc.note ? `<p class="text-[10px] mt-1 line-clamp-2 ${isSelected ? 'text-stone-200' : 'text-brand-400'}">${svc.note}</p>` : ''}
            </div>
            <div class="text-[9.5px] font-mono flex items-center gap-1 ${isSelected ? 'text-amber-100' : 'text-brand-400'}">
              <i class="fa-solid ${isSelected ? 'fa-circle-check' : 'fa-circle-dot'}"></i>
              <span>${isSelected ? '已選取此主要項目' : '點擊選取'}</span>
            </div>
          </button>
        `;
      }).join('');
    }

    function selectServiceItem(id) {
      const found = quoteConfig.services.find(s => s.id === id);
      selectedService = (selectedService && selectedService.id === id) ? null : found;

      document.getElementById('selected-service-badge').innerText = selectedService ? selectedService.name : '尚未選擇';
      renderServicesGrid();
      updateCartSummary();
    }

    // 5. 附加升級與工藝護理 (複選切換)
    function renderAddonsList() {
      const container = document.getElementById('quote-addons-container');
      const addons = quoteConfig.addons || [];

      if (addons.length === 0) {
        container.innerHTML = '<div class="py-4 text-center text-xs text-brand-400">無附加選項</div>';
        return;
      }

      container.innerHTML = addons.map(adn => {
        const isChecked = selectedAddons.some(a => a.id === adn.id);
        return `
          <div onclick="toggleAddonItem('${adn.id}')" class="p-3 rounded-2xl border cursor-pointer transition flex items-center justify-between gap-3 shadow-2xs ${
            isChecked 
              ? 'bg-stone-900 text-white border-stone-900' 
              : 'bg-brand-50/60 hover:bg-brand-100/60 border-brand-200 text-brand-900'
          }">
            <div class="flex items-center gap-2.5 truncate">
              <div class="w-5 h-5 rounded-lg flex items-center justify-center border text-xs shrink-0 ${
                isChecked ? 'bg-amber-400 text-stone-950 border-amber-400' : 'border-brand-300 bg-white'
              }">
                ${isChecked ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
              </div>
              <div class="truncate">
                <span class="font-bold text-xs block truncate">${adn.name}</span>
                ${adn.desc ? `<span class="text-[10px] block truncate ${isChecked ? 'text-stone-300' : 'text-brand-400'}">${adn.desc}</span>` : ''}
              </div>
            </div>
            <span class="font-mono font-bold text-xs shrink-0 ${isChecked ? 'text-amber-300' : 'text-brand-700'}">
              + NT$ ${adn.price.toLocaleString()}
            </span>
          </div>
        `;
      }).join('');
    }

    function toggleAddonItem(id) {
      const found = quoteConfig.addons.find(a => a.id === id);
      const idx = selectedAddons.findIndex(a => a.id === id);
      if (idx > -1) {
        selectedAddons.splice(idx, 1);
      } else {
        selectedAddons.push(found);
      }
      renderAddonsList();
      updateCartSummary();
    }

    // 6. 更新明細與試算總金額
    function updateCartSummary() {
      const container = document.getElementById('quote-cart-items');
      const totalDisplay = document.getElementById('quote-total-price');

      if (!selectedService && selectedAddons.length === 0) {
        container.innerHTML = '<div class="text-center py-4 text-brand-400">尚未選取任何項目</div>';
        totalDisplay.innerText = 'NT$ 0';
        return;
      }

      let total = 0;
      let html = '';

      if (selectedService) {
        total += selectedService.price;
        html += `
          <div class="flex justify-between items-center p-2.5 bg-brand-50 rounded-xl border border-brand-200 font-bold">
            <span class="text-brand-900">核心項目：${selectedService.name}</span>
            <span class="font-mono text-brand-700">NT$ ${selectedService.price.toLocaleString()}</span>
          </div>
        `;
      }

      selectedAddons.forEach(a => {
        total += a.price;
        html += `
          <div class="flex justify-between items-center px-3 py-1.5 bg-white rounded-lg border border-brand-100 text-[11px]">
            <span class="text-brand-600">＋ ${a.name}</span>
            <span class="font-mono text-brand-600 font-bold">+ NT$ ${a.price.toLocaleString()}</span>
          </div>
        `;
      });

      container.innerHTML = html;
      totalDisplay.innerText = `NT$ ${total.toLocaleString()}`;
    }

    function resetQuoteCart() {
      selectedService = null;
      selectedAddons = [];
      document.getElementById('selected-service-badge').innerText = '尚未選擇';
      renderServicesGrid();
      renderAddonsList();
      updateCartSummary();
    }

    // 7. 一鍵複製明細並跳轉官方 LINE (高質感深林綠按鈕觸發)
    async function copyQuoteAndRedirectLine() {
      if (!selectedService) {
        return Swal.fire('請先選取一項主要服務核心項目！', '', 'warning');
      }

      let total = selectedService.price;
      selectedAddons.forEach(a => total += a.price);

      const addonText = selectedAddons.length > 0 
        ? selectedAddons.map(a => `• ${a.name} (+NT$ ${a.price})`).join('\n')
        : '無加購護理';

      const quoteMessage = 
        `您好！我在官網完成了線上報價試算，想諮詢以下項目之預約時段：\n\n` +
        `【門市名稱】：${currentStore.store_name}\n` +
        `【主要服務】：${selectedService.name} (NT$ ${selectedService.price.toLocaleString()})\n` +
        `【工藝加購】：\n${addonText}\n` +
        `─────────────\n` +
        `【預算小計】：NT$ ${total.toLocaleString()} 元\n\n` +
        `請問近期有哪些空檔時段可以安排施作呢？謝謝！`;

      // 複製到剪貼簿
      try {
        await navigator.clipboard.writeText(quoteMessage);
      } catch (e) {
        console.warn("剪貼簿讀寫被瀏覽器限制，轉由網址參數直接傳遞");
      }

      const lineBase = quoteConfig.lineUrl || currentStore.line_url || "https://line.me/R/ti/p/@480kqjoj";
      const lineUrl = `${lineBase}?text=${encodeURIComponent(quoteMessage)}`;

      Swal.fire({
        title: '報價明細已成功複製！',
        html: `
          <div class="text-left text-xs bg-brand-50 p-3.5 rounded-2xl border border-brand-200 space-y-1.5 font-sans leading-relaxed">
            <div>門市：<b>${currentStore.store_name}</b></div>
            <div>項目：<b>${selectedService.name}</b></div>
            <div>附加：${selectedAddons.length > 0 ? selectedAddons.map(a=>a.name).join('、') : '無'}</div>
            <div>預估金額：<b class="text-[#1F4E3D] font-mono text-sm">NT$ ${total.toLocaleString()}</b></div>
            <div class="text-emerald-800 font-bold pt-1">✓ 完整明細已複製到剪貼簿，點擊下方前往 LINE 直接貼上送出！</div>
          </div>
        `,
        confirmButtonText: '前往官方 LINE 預約',
        confirmButtonColor: '#1F4E3D',
        showCancelButton: true,
        cancelButtonText: '返回修改'
      }).then(r => {
        if (r.isConfirmed) {
          window.open(lineUrl, '_blank');
        }
      });
    }
  </script>
</body>
</html>
