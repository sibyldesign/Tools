<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG 限動空檔告示圖產生器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root { --primary-color: #d4a373; --bg-color: #f7f3f0; --text-color: #333; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
    .app-container { max-width: 1050px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
    @media (max-width: 768px) { .app-container { grid-template-columns: 1fr; } }
    .control-panel { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; color: #4a4036; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #666; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .form-control:focus { border-color: var(--primary-color); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .theme-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
    .theme-btn { padding: 10px; border: 2px solid transparent; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-align: center; }
    .theme-btn.active { border-color: #333; transform: scale(1.02); }
    .theme-latte { background: #f3ece4; color: #6f4e37; }
    .theme-minimal { background: #f0f0f0; color: #222; }
    .theme-blush { background: #fcebeb; color: #b56576; }
    .theme-dark { background: #262626; color: #d4af37; }
    .time-slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 8px; max-height: 200px; overflow-y: auto; padding: 6px; border: 1px solid #eee; border-radius: 8px; background: #fafafa; }
    .slot-chip { padding: 8px 4px; border-radius: 6px; border: 1px solid #ddd; background: #fff; font-size: 0.82rem; text-align: center; cursor: pointer; }
    .slot-chip.selected { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    .btn-action { width: 100%; padding: 14px; background: #333; color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .preview-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .preview-canvas { width: 340px; height: 600px; padding: 35px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: space-between; }
    .theme-latte-style { background: linear-gradient(135deg, #f7f1ea 0%, #ede0d4 100%); color: #5c4738; }
    .theme-latte-style .card-slot { background: rgba(255,255,255,0.7); }
    .theme-minimal-style { background: #ffffff; color: #1a1a1a; border: 1px solid #e0e0e0; }
    .theme-minimal-style .card-slot { background: #f5f5f5; }
    .theme-blush-style { background: linear-gradient(135deg, #fef5f5 0%, #f7dede 100%); color: #724046; }
    .theme-blush-style .card-slot { background: rgba(255,255,255,0.8); }
    .theme-dark-style { background: linear-gradient(135deg, #1f1f1f 0%, #111111 100%); color: #e5c158; }
    .theme-dark-style .card-slot { background: #2a2a2a; border: 1px solid #444; }
    .canvas-header { text-align: center; }
    .canvas-brand { font-family: 'Playfair Display', serif; font-size: 1.3rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .canvas-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .canvas-date { font-size: 0.9rem; opacity: 0.85; }
    .canvas-body { flex: 1; margin: 20px 0; display: flex; flex-direction: column; justify-content: center; }
    .slot-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card-slot { padding: 10px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 1rem; }
    .canvas-footer { text-align: center; font-size: 0.78rem; line-height: 1.4; opacity: 0.9; border-top: 1px dashed rgba(150,150,150,0.3); padding-top: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="control-panel">
      <div class="panel-title">✨ 空檔告示圖設定</div>
      <div class="form-group">
        <label>選擇色系風格</label>
        <div class="theme-selector">
          <div class="theme-btn theme-latte active" onclick="setTheme('latte')">溫柔奶茶</div>
          <div class="theme-btn theme-minimal" onclick="setTheme('minimal')">無印極簡</div>
          <div class="theme-btn theme-blush" onclick="setTheme('blush')">浪漫柔粉</div>
          <div class="theme-btn theme-dark" onclick="setTheme('dark')">輕奢微醺</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>店名 / 品牌</label>
          <input type="text" id="inputBrand" class="form-control" value="SIBYL NAIL" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label>公告標題</label>
          <input type="text" id="inputTitle" class="form-control" value="本週釋出空檔" oninput="updatePreview()">
        </div>
      </div>
      <div class="form-group">
        <label>公告日期區間</label>
        <input type="text" id="inputDate" class="form-control" value="10/25 (五) - 10/26 (六)" oninput="updatePreview()">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>時間間隔</label>
          <select id="intervalSelect" class="form-control" onchange="generateSlots()">
            <option value="60">60 分鐘</option>
            <option value="30">30 分鐘</option>
          </select>
        </div>
        <div class="form-group">
          <label>營業時段範圍</label>
          <div style="display: flex; gap: 4px; align-items: center;">
            <input type="number" id="startHour" class="form-control" value="11" min="6" max="23" onchange="generateSlots()">
            <span>至</span>
            <input type="number" id="endHour" class="form-control" value="20" min="6" max="23" onchange="generateSlots()">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>點擊切換可預約空檔（綠底代表已選取）：</label>
        <div class="time-slot-grid" id="slotsContainer"></div>
      </div>
      <div class="form-group">
        <label>預約備註</label>
        <textarea id="inputFooter" class="form-control" rows="2" oninput="updatePreview()">預約請加入官方 LINE: @sibyl&#10;保留15分鐘 · 謝絕攜伴</textarea>
      </div>
      <button class="btn-action" onclick="downloadImage()">📸 一鍵生成並下載 IG 限動圖</button>
    </div>

    <div class="preview-wrapper">
      <div id="captureArea" class="preview-canvas theme-latte-style">
        <div class="canvas-header">
          <div class="canvas-brand" id="viewBrand">SIBYL NAIL</div>
          <div class="canvas-title" id="viewTitle">本週釋出空檔</div>
          <div class="canvas-date" id="viewDate">10/25 (五) - 10/26 (六)</div>
        </div>
        <div class="canvas-body">
          <div class="slot-list" id="viewSlots"></div>
        </div>
        <div class="canvas-footer" id="viewFooter">
          預約請加入官方 LINE: @sibyl<br>保留15分鐘 · 謝絕攜伴
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTheme = 'latte';
    let selectedSlots = new Set(["13:00", "15:00", "18:00"]);

    window.onload = function() { generateSlots(); updatePreview(); };

    function setTheme(theme) {
      currentTheme = theme;
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.theme-${theme}`).classList.add('active');
      document.getElementById('captureArea').className = `preview-canvas theme-${theme}-style`;
    }

    function generateSlots() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      const start = parseInt(document.getElementById('startHour').value);
      const end = parseInt(document.getElementById('endHour').value);
      const interval = parseInt(document.getElementById('intervalSelect').value);

      for (let h = start; h < end; h++) {
        for (let m = 0; m < 60; m += interval) {
          const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          const chip = document.createElement('div');
          chip.className = `slot-chip ${selectedSlots.has(timeStr) ? 'selected' : ''}`;
          chip.innerText = timeStr;
          chip.onclick = () => {
            if (selectedSlots.has(timeStr)) { selectedSlots.delete(timeStr); chip.classList.remove('selected'); }
            else { selectedSlots.add(timeStr); chip.classList.add('selected'); }
            updatePreview();
          };
          container.appendChild(chip);
        }
      }
      updatePreview();
    }

    function updatePreview() {
      document.getElementById('viewBrand').innerText = document.getElementById('inputBrand').value;
      document.getElementById('viewTitle').innerText = document.getElementById('inputTitle').value;
      document.getElementById('viewDate').innerText = document.getElementById('inputDate').value;
      document.getElementById('viewFooter').innerHTML = document.getElementById('inputFooter').value.replace(/\n/g, '<br>');

      const slotListEl = document.getElementById('viewSlots');
      slotListEl.innerHTML = '';
      const sorted = Array.from(selectedSlots).sort();
      if (sorted.length === 0) {
        slotListEl.innerHTML = '<div style="grid-column: span 2; text-align: center; opacity: 0.6; padding: 20px;">今日預約已滿</div>';
      } else {
        sorted.forEach(slot => {
          const item = document.createElement('div');
          item.className = 'card-slot';
          item.innerText = slot;
          slotListEl.appendChild(item);
        });
      }
    }

    function downloadImage() {
      html2canvas(document.getElementById('captureArea'), { scale: 2, useCORS: true, backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = `空檔公告_${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
